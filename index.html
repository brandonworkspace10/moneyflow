<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>moneyflow</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; }
:root { --font: 'Inter', ui-sans-serif, system-ui, sans-serif; }
body { font-family: var(--font); -webkit-font-smoothing: antialiased; }
body.grabbing * { cursor: grabbing !important; }
#root { height: 100%; }

/* ── THEMES ────────────────────────────────────────────────────────────── */
.app { height: 100%; display: flex; flex-direction: column; overflow: hidden; }

/* Dark (default) */
.app[data-theme="dark"] {
  --bg: #080C12;
  --canvas: #080C12;
  --grid: rgba(255,255,255,.032);
  --ink: #E2E8F4;
  --ink2: #C4CFDE;
  --muted: #5E7083;
  --line: rgba(255,255,255,.08);
  --card: #0F1621;
  --card2: #141C2A;
  --card-border: rgba(255,255,255,.09);
  --accent: #00C878;
  --accent-soft: rgba(0,200,120,.12);
  --accent-glow: rgba(0,200,120,.25);
  --toolbar: rgba(8,12,18,.88);
  --pill-bg: #141C2A;
  --r: 16px;
  --shadow: 0 1px 2px rgba(0,0,0,.4), 0 8px 28px rgba(0,0,0,.5);
  --shadow-hover: 0 1px 2px rgba(0,0,0,.5), 0 16px 40px rgba(0,0,0,.6);
}
/* Light */
.app[data-theme="light"] {
  --bg: #F1F3F8;
  --canvas: #F1F3F8;
  --grid: rgba(0,0,0,.055);
  --ink: #0D1829;
  --ink2: #2D3E55;
  --muted: #6B7E96;
  --line: rgba(0,0,0,.08);
  --card: #FFFFFF;
  --card2: #F7F9FC;
  --card-border: rgba(0,0,0,.08);
  --accent: #059669;
  --accent-soft: rgba(5,150,105,.1);
  --accent-glow: rgba(5,150,105,.2);
  --toolbar: rgba(255,255,255,.92);
  --pill-bg: #FFFFFF;
  --r: 16px;
  --shadow: 0 1px 3px rgba(0,0,0,.06), 0 8px 24px rgba(0,0,0,.08);
  --shadow-hover: 0 1px 3px rgba(0,0,0,.08), 0 16px 36px rgba(0,0,0,.13);
}
/* Midnight blue */
.app[data-theme="midnight"] {
  --bg: #06090F;
  --canvas: #06090F;
  --grid: rgba(99,120,200,.07);
  --ink: #DCE4F5;
  --ink2: #B0C0DC;
  --muted: #4A5870;
  --line: rgba(99,120,200,.12);
  --card: #0D1422;
  --card2: #121A2C;
  --card-border: rgba(99,120,200,.15);
  --accent: #818CF8;
  --accent-soft: rgba(129,140,248,.12);
  --accent-glow: rgba(129,140,248,.28);
  --toolbar: rgba(6,9,15,.9);
  --pill-bg: #0D1422;
  --r: 18px;
  --shadow: 0 1px 2px rgba(0,0,0,.6), 0 8px 32px rgba(0,0,0,.6);
  --shadow-hover: 0 1px 2px rgba(0,0,0,.7), 0 16px 48px rgba(0,0,0,.7);
}
/* Sand */
.app[data-theme="sand"] {
  --bg: #F5F0E8;
  --canvas: #F5F0E8;
  --grid: rgba(100,80,40,.06);
  --ink: #211A0E;
  --ink2: #3D3020;
  --muted: #8C7A60;
  --line: rgba(100,80,40,.1);
  --card: #FDFAF4;
  --card2: #F7F2E8;
  --card-border: rgba(100,80,40,.1);
  --accent: #C2761F;
  --accent-soft: rgba(194,118,31,.1);
  --accent-glow: rgba(194,118,31,.22);
  --toolbar: rgba(245,240,232,.9);
  --pill-bg: #FDFAF4;
  --r: 12px;
  --shadow: 0 1px 3px rgba(80,60,20,.08), 0 8px 24px rgba(80,60,20,.1);
  --shadow-hover: 0 1px 3px rgba(80,60,20,.1), 0 16px 36px rgba(80,60,20,.16);
}

/* ── TOOLBAR ────────────────────────────────────────────────────────────── */
.toolbar {
  flex: 0 0 auto; height: 54px; display: flex; align-items: center; gap: 8px;
  padding: 0 18px; z-index: 40; position: relative;
  background: var(--toolbar); backdrop-filter: blur(20px) saturate(180%);
  border-bottom: 1px solid var(--line);
}
.brand { display: flex; align-items: center; gap: 9px; text-decoration: none; }
.brand-mark {
  width: 32px; height: 32px; border-radius: 9px; display: grid; place-items: center;
  background: var(--accent); color: #fff;
  box-shadow: 0 0 0 1px var(--accent-glow), 0 4px 12px var(--accent-glow);
}
.brand-name { font-weight: 700; font-size: 16px; letter-spacing: -.03em; color: var(--ink); }
.brand-name em { color: var(--accent); font-style: normal; }
.tb-divider { width: 1px; height: 22px; background: var(--line); margin: 0 4px; }
.tb-actions { display: flex; align-items: center; gap: 6px; }
.tb-spacer { flex: 1; }

.tb-btn {
  display: inline-flex; align-items: center; gap: 6px;
  height: 34px; padding: 0 12px; border: none; border-radius: 9px;
  font: 600 13px var(--font); cursor: pointer; transition: all .12s;
  white-space: nowrap;
}
.tb-btn:active { transform: scale(.97); }
.tb-btn.solid {
  background: var(--accent); color: #fff;
  box-shadow: 0 2px 8px var(--accent-glow);
}
.tb-btn.solid:hover { filter: brightness(1.08); }
.tb-btn.outline {
  background: transparent; color: var(--muted);
  border: 1px solid var(--line);
}
.tb-btn.outline:hover { color: var(--ink); background: var(--card); }

.preset-wrap {
  position: relative; display: inline-flex; align-items: center;
  height: 34px; border: 1px solid var(--line); border-radius: 9px;
  background: var(--card); padding: 0 10px; gap: 6px;
}
.preset-wrap svg { color: var(--muted); }
.preset-wrap select {
  appearance: none; border: 0; background: transparent; outline: none;
  font: 600 13px var(--font); color: var(--ink); padding-right: 16px; cursor: pointer;
}
.preset-wrap::after {
  content: ''; position: absolute; right: 10px; pointer-events: none;
  width: 6px; height: 6px;
  border-right: 1.5px solid var(--muted); border-bottom: 1.5px solid var(--muted);
  transform: rotate(45deg) translateY(-2px);
}

/* summary */
.summary { display: flex; align-items: center; gap: 10px; }
.sum-chip {
  display: flex; flex-direction: column; align-items: flex-end;
  padding: 4px 10px; border-radius: 8px; background: var(--card);
  border: 1px solid var(--line); line-height: 1.15;
}
.sum-label { font-size: 9.5px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
.sum-value { font-size: 13.5px; font-weight: 700; font-variant-numeric: tabular-nums; letter-spacing: -.02em; color: var(--ink); }
.sum-chip.s-good .sum-value { color: var(--accent); }
.sum-chip.s-warn .sum-value { color: #F59E0B; }
.sum-chip.s-bad  .sum-value, .sum-chip.s-bad .sum-label { color: #F43F5E; }

/* ── CANVAS ─────────────────────────────────────────────────────────────── */
.canvas { flex: 1; position: relative; overflow: hidden; background: var(--canvas); cursor: grab; }
.canvas.connecting { cursor: crosshair; }
.board { position: absolute; left: 0; top: 0; transform-origin: 0 0; will-change: transform; }
.grid-bg { position: absolute; left: -8000px; top: -8000px; width: 24000px; height: 24000px; pointer-events: none; }
.grid-dots .grid-bg {
  background-image: radial-gradient(circle, var(--grid) 1.5px, transparent 1.6px);
  background-size: 28px 28px;
}
.grid-lines .grid-bg {
  background-image: linear-gradient(var(--grid) 1px,transparent 1px), linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size: 28px 28px;
}
.grid-none .grid-bg { background: none; }

/* ── EDGES ─────────────────────────────────────────────────────────────── */
.edge-svg { position: absolute; left: 0; top: 0; overflow: visible; pointer-events: none; }
.edge { pointer-events: auto; }
.edge.dim { opacity: .2; }
.e-snake { stroke-dasharray: 4 6; animation: snake .8s linear infinite; }
.e-dots  { stroke-dasharray: .1 9; stroke-linecap: round; animation: snake 1.1s linear infinite; }
.e-solid { stroke-dasharray: none; }
.e-temp  { stroke-dasharray: 5 7; animation: snake .7s linear infinite; pointer-events: none; opacity: .7; }
@keyframes snake { to { stroke-dashoffset: -10; } }
@media (prefers-reduced-motion) { .e-snake, .e-dots, .e-temp { animation: none; } }

/* ── EDGE PILLS ─────────────────────────────────────────────────────────── */
.pills { position: absolute; left: 0; top: 0; pointer-events: none; }
.pill { position: absolute; transform: translate(-50%,-50%); z-index: 6; pointer-events: auto; }
.pill-face {
  display: flex; flex-direction: column; align-items: center; gap: 0;
  padding: 5px 11px; border-radius: 999px; cursor: pointer;
  background: var(--pill-bg); border: 1px solid var(--card-border);
  box-shadow: 0 2px 10px rgba(0,0,0,.25); transition: transform .1s, box-shadow .1s;
  font-family: var(--font);
}
.pill-face:hover { transform: scale(1.05) translateY(-1px); box-shadow: 0 4px 16px rgba(0,0,0,.35); }
.pill.sel .pill-face {
  border-color: var(--pi);
  box-shadow: 0 0 0 3px color-mix(in srgb, var(--pi) 18%, transparent), 0 4px 14px rgba(0,0,0,.3);
}
.pill-main { font-size: 11.5px; font-weight: 700; color: var(--pi); font-variant-numeric: tabular-nums; }
.pill-sub  { font-size: 9px;  font-weight: 500; color: var(--muted); font-variant-numeric: tabular-nums; }
.pill-edit {
  display: inline-flex; align-items: center; gap: 2px;
  background: var(--pill-bg); border: 1.5px solid var(--pi); border-radius: 999px;
  padding: 4px 10px; box-shadow: 0 0 0 3px color-mix(in srgb, var(--pi) 15%, transparent);
}
.pill-edit input {
  width: 54px; border: 0; outline: 0; background: transparent; font: 700 12px var(--font);
  color: var(--pi); text-align: center; font-variant-numeric: tabular-nums;
}
.pill-unit { font: 700 12px var(--font); color: var(--pi); }
.pill-del {
  position: absolute; top: -8px; right: -8px; width: 18px; height: 18px; border-radius: 50%;
  border: 0; background: #F43F5E; color: #fff; display: grid; place-items: center; cursor: pointer;
  box-shadow: 0 2px 8px rgba(244,63,94,.4);
}

/* ── NODE CARD ──────────────────────────────────────────────────────────── */
.node {
  position: absolute; width: 240px;
  background: var(--card); border-radius: var(--r);
  border: 1px solid var(--card-border);
  border-left: 3px solid var(--ci); /* colored accent stripe */
  box-shadow: var(--shadow);
  user-select: none; cursor: grab;
  transition: box-shadow .18s, border-color .18s, transform .08s;
}
.node:hover:not(.no-hover) { box-shadow: var(--shadow-hover); }
.node.sel { border-left-color: var(--ci); box-shadow: 0 0 0 2px var(--cr), var(--shadow-hover); }
.node.drop-target { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent-glow), var(--shadow); }
.node.is-income { border-left-color: var(--accent); cursor: grab; }
.node:active { cursor: grabbing; }

/* node header */
.n-head { display: flex; align-items: center; gap: 8px; padding: 13px 13px 8px 11px; }
.n-icon {
  flex: 0 0 auto; width: 28px; height: 28px; border-radius: 8px;
  display: grid; place-items: center;
  background: var(--cs); color: var(--ci);
  border: 0; cursor: pointer; transition: filter .12s, transform .1s;
}
.n-icon:hover:not([disabled]) { filter: brightness(.92); transform: scale(1.06); }
.node.is-income .n-icon { background: var(--accent); color: #fff; cursor: default; pointer-events: none; }
.n-name {
  flex: 1; min-width: 0; border: 0; background: transparent; outline: none;
  font: 600 13.5px var(--font); color: var(--ink); letter-spacing: -.01em;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  padding: 3px 4px; border-radius: 6px; cursor: text;
}
.n-name.editing, .n-name-input {
  background: var(--card2); box-shadow: inset 0 0 0 1.5px var(--line); cursor: text;
}
.n-name-input { width: 100%; font: 600 13.5px var(--font); color: var(--ink); padding: 3px 4px; border-radius: 6px; border: 0; outline: none; letter-spacing: -.01em; }
.n-del {
  flex: 0 0 auto; width: 22px; height: 22px; border-radius: 6px;
  border: 1px solid var(--line); background: transparent; color: var(--muted);
  cursor: pointer; display: grid; place-items: center; opacity: .45;
  transition: opacity .12s, background .12s, border-color .12s, color .12s;
}
.node:hover .n-del { opacity: 1; }
.n-del:hover { background: rgba(244,63,94,.12); border-color: rgba(244,63,94,.3); color: #F43F5E; }

/* node body */
.n-body { padding: 0 13px 12px 11px; }

/* income amount input */
.inc-amount { display: flex; align-items: baseline; gap: 3px; padding: 2px 0 6px; }
.inc-cur { font: 600 15px var(--font); color: var(--muted); line-height: 1; }
.inc-input {
  flex: 1; border: 0; outline: none; background: transparent;
  font: 800 30px var(--font); letter-spacing: -.04em; color: var(--ink);
  font-variant-numeric: tabular-nums; padding: 0; line-height: 1.1;
}

/* bucket amount */
.bkt-amount {
  font: 800 28px var(--font); letter-spacing: -.04em; color: var(--ink);
  font-variant-numeric: tabular-nums; padding: 2px 0 6px;
  cursor: text; border-radius: 8px; display: inline-block;
  transition: background .1s;
}
.bkt-amount:hover { background: var(--card2); padding-left: 5px; margin-left: -5px; }
.bkt-amount-wrap { display: flex; align-items: baseline; gap: 3px; padding: 2px 0 6px; }
.bkt-cur { font: 600 15px var(--font); color: var(--muted); line-height: 1; }
.bkt-input {
  flex: 1; border: 0; outline: none; font: 800 28px var(--font); letter-spacing: -.04em;
  color: var(--ink); font-variant-numeric: tabular-nums; padding: 2px 5px;
  background: var(--card2); border-radius: 8px; box-shadow: inset 0 0 0 1.5px var(--ci);
  line-height: 1.1;
}
.bkt-empty {
  display: flex; align-items: center; gap: 6px; padding: 6px 0;
  font: 500 11.5px var(--font); color: var(--muted); border-radius: 8px;
}
.bkt-empty-icon {
  width: 20px; height: 20px; border-radius: 6px; border: 1.5px dashed var(--muted);
  display: grid; place-items: center; flex-shrink: 0; opacity: .5;
}

/* meter bar */
.n-meter { height: 3px; border-radius: 999px; background: var(--line); overflow: visible; margin-bottom: 2px; }
.n-meter-fill {
  height: 100%; border-radius: 999px;
  background: linear-gradient(90deg, var(--ci), color-mix(in srgb, var(--ci) 60%, #fff));
  transition: width .35s cubic-bezier(.4,0,.2,1);
}
.node.is-income .n-meter-fill {
  background: linear-gradient(90deg, var(--accent), color-mix(in srgb, var(--accent) 60%, #a8ffd8));
}
.n-meter-fill.over { background: #F43F5E; }

/* footer */
.n-foot { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-top: 10px; }
.mode-pill { display: flex; background: var(--card2); border: 1px solid var(--line); border-radius: 8px; padding: 2px; gap: 1px; }
.mode-pill button {
  width: 28px; height: 22px; border: 0; border-radius: 6px; background: transparent;
  font: 600 12px var(--font); color: var(--muted); cursor: pointer; transition: all .1s;
}
.mode-pill button.active { background: var(--card); color: var(--ink); box-shadow: 0 1px 4px rgba(0,0,0,.18); }
.leftover { display: flex; flex-direction: column; align-items: flex-end; line-height: 1.2; }
.lo-label { font: 600 9px var(--font); letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
.lo-value { font: 700 12.5px var(--font); font-variant-numeric: tabular-nums; letter-spacing: -.01em; color: var(--ink2); }
.lo-good .lo-value, .lo-good .lo-label { color: var(--accent); }
.lo-warn .lo-value { color: #F59E0B; }
.lo-bad  .lo-value, .lo-bad  .lo-label { color: #F43F5E; }
.lo-zero .lo-value { color: var(--muted); }

/* ── CONNECTION HANDLES ─────────────────────────────────────────────────── */
.handle { position: absolute; top: 44px; display: grid; place-items: center; z-index: 5; }
.h-out { right: -14px; width: 28px; height: 28px; cursor: crosshair; }
.h-in  { left:  -14px; width: 28px; height: 28px; cursor: default; }
.h-out-dot {
  width: 16px; height: 16px; border-radius: 50%;
  background: var(--card); border: 2px solid var(--ci);
  box-shadow: 0 0 0 0 transparent;
  transition: transform .15s, background .15s, box-shadow .15s;
}
.node.is-income .h-out-dot { border-color: var(--accent); }
.h-out:hover .h-out-dot {
  transform: scale(1.5); background: var(--ci);
  box-shadow: 0 0 0 4px color-mix(in srgb, var(--ci) 22%, transparent);
}
.node.is-income .h-out:hover .h-out-dot { background: var(--accent); box-shadow: 0 0 0 4px var(--accent-glow); }
.h-in-dot {
  width: 10px; height: 10px; border-radius: 50%;
  background: transparent; border: 2px solid var(--muted); opacity: .35;
  transition: transform .12s, background .12s, border-color .12s, opacity .12s;
}
.node.drop-target .h-in-dot { border-color: var(--accent); background: var(--accent); opacity: 1; transform: scale(1.4); }

/* connect label */
.h-out-label {
  position: absolute; right: 30px; top: 50%; transform: translateY(-50%);
  font: 600 9.5px var(--font); letter-spacing: .04em; text-transform: uppercase;
  color: var(--ink); background: var(--card2); border: 1px solid var(--line);
  padding: 3px 6px; border-radius: 5px; white-space: nowrap;
  pointer-events: none; opacity: 0; transition: opacity .12s;
}
.h-out:hover .h-out-label { opacity: 1; }

/* ── HINT BAR ───────────────────────────────────────────────────────────── */
.hint-bar {
  position: absolute; bottom: 16px; left: 50%; transform: translateX(-50%);
  z-index: 25; display: flex; gap: 0; align-items: center;
  background: var(--card); border: 1px solid var(--card-border);
  border-radius: 10px; box-shadow: var(--shadow); overflow: hidden;
  font: 500 11px var(--font); color: var(--muted); white-space: nowrap;
}
.hint-bar span {
  padding: 8px 14px; display: flex; align-items: center; gap: 5px;
}
.hint-bar span + span { border-left: 1px solid var(--line); }
.hint-bar b { color: var(--ink); font-weight: 600; }
@media (max-width: 860px) { .hint-bar { display: none; } }

/* ── TWEAKS PANEL ───────────────────────────────────────────────────────── */
</style>
</head>
<body>
<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js"></script>

<script type="text/babel">
// ── helpers ──────────────────────────────────────────────────────────────────
const fmt$ = (n, cents) => {
  const v = Math.abs(n) < .005 ? 0 : n;
  return '$' + v.toLocaleString('en-US', { minimumFractionDigits: cents ? 2 : 0, maximumFractionDigits: cents ? 2 : 0 });
};
const fmtPct = n => { const v = Math.round(n * 10) / 10; return (Number.isInteger(v) ? v : v.toFixed(1)) + '%'; };
const uid = p => (p || 'x') + '_' + Math.random().toString(36).slice(2, 8);

// ── palette ──────────────────────────────────────────────────────────────────
const PAL = [
  { key: 'emerald', s: '#052e16', i: '#4ade80', l: '#22c55e', r: '#16a34a' },
  { key: 'sky',     s: '#0c1a35', i: '#60a5fa', l: '#3b82f6', r: '#2563eb' },
  { key: 'violet',  s: '#1e0b3a', i: '#a78bfa', l: '#8b5cf6', r: '#7c3aed' },
  { key: 'amber',   s: '#2d1a00', i: '#fbbf24', l: '#f59e0b', r: '#d97706' },
  { key: 'rose',    s: '#2d0a14', i: '#fb7185', l: '#f43f5e', r: '#e11d48' },
  { key: 'teal',    s: '#012e28', i: '#2dd4bf', l: '#14b8a6', r: '#0d9488' },
  { key: 'indigo',  s: '#1e1b4b', i: '#818cf8', l: '#6366f1', r: '#4f46e5' },
  { key: 'fuchsia', s: '#2d0a30', i: '#e879f9', l: '#d946ef', r: '#c026d3' },
];
// light-theme overrides for palette (readable on white)
const PAL_LIGHT = [
  { key: 'emerald', s: '#d1fae5', i: '#065f46', l: '#10b981', r: '#a7f3d0' },
  { key: 'sky',     s: '#dbeafe', i: '#1e40af', l: '#3b82f6', r: '#bfdbfe' },
  { key: 'violet',  s: '#ede9fe', i: '#5b21b6', l: '#8b5cf6', r: '#ddd6fe' },
  { key: 'amber',   s: '#fef9c3', i: '#92400e', l: '#f59e0b', r: '#fde68a' },
  { key: 'rose',    s: '#ffe4e6', i: '#9f1239', l: '#f43f5e', r: '#fecdd3' },
  { key: 'teal',    s: '#ccfbf1', i: '#115e59', l: '#14b8a6', r: '#99f6e4' },
  { key: 'indigo',  s: '#e0e7ff', i: '#3730a3', l: '#6366f1', r: '#c7d2fe' },
  { key: 'fuchsia', s: '#fae8ff', i: '#86198f', l: '#d946ef', r: '#f5d0fe' },
];
const colorFor = (key, theme) => {
  const list = (theme === 'light' || theme === 'sand') ? PAL_LIGHT : PAL;
  return list.find(p => p.key === key) || list[0];
};

// ── flow math ────────────────────────────────────────────────────────────────
function computeFlow(nodes, edges) {
  const map = {}; nodes.forEach(n => map[n.id] = n);
  const out = {}, inc = {};
  nodes.forEach(n => { out[n.id] = []; inc[n.id] = []; });
  edges.forEach(e => { if(map[e.from]&&map[e.to]&&e.from!==e.to){ out[e.from].push(e); inc[e.to].push(e); } });
  const deg = {}; nodes.forEach(n => deg[n.id] = inc[n.id].length);
  const q = nodes.filter(n => deg[n.id]===0).map(n=>n.id), order = [];
  while(q.length){ const id=q.shift(); order.push(id); out[id].forEach(e=>{ if(--deg[e.to]===0) q.push(e.to); }); }
  nodes.forEach(n => { if(!order.includes(n.id)) order.push(n.id); });
  const rcv={}, alloc={}, left={}, eAmt={};
  nodes.forEach(n => rcv[n.id] = n.type==='income' ? (Number(n.amount)||0) : 0);
  order.forEach(id => {
    const node=map[id], avail=rcv[id]; let a=0;
    out[id].forEach(e => {
      let amt = node.mode==='%' ? avail*(Number(e.value)||0)/100 : (Number(e.value)||0);
      if(amt<0) amt=0;
      eAmt[e.id]=amt; a+=amt; rcv[e.to]=(rcv[e.to]||0)+amt;
    });
    alloc[id]=a; left[id]=avail-a;
  });
  return { rcv, alloc, left, eAmt };
}

}

function Tweaks({ open, onClose, children }) {
  const ref = React.useRef(null);
  const off = React.useRef({ x: 16, y: 16 });
  const clamp = React.useCallback(() => {
    const el = ref.current; if (!el) return;
    const mxR = Math.max(16, window.innerWidth - el.offsetWidth - 16);
    const mxB = Math.max(16, window.innerHeight - el.offsetHeight - 16);
    off.current = { x: Math.min(mxR, Math.max(16, off.current.x)), y: Math.min(mxB, Math.max(16, off.current.y)) };
    el.style.right = off.current.x + 'px'; el.style.bottom = off.current.y + 'px';
  }, []);
  React.useEffect(() => { if (open) setTimeout(clamp, 0); }, [open, clamp]);
  const onDrag = e => {
    const el = ref.current; if (!el) return;
    const r = el.getBoundingClientRect();
    const sx = e.clientX, sy = e.clientY;
    const sr = window.innerWidth - r.right, sb = window.innerHeight - r.bottom;
    const mm = ev => { off.current = { x: sr-(ev.clientX-sx), y: sb-(ev.clientY-sy) }; clamp(); };
    const mu = () => { window.removeEventListener('mousemove',mm); window.removeEventListener('mouseup',mu); };
    window.addEventListener('mousemove',mm); window.addEventListener('mouseup',mu);
  };
  if (!open) return null;
  return (
    <>
      <style>{TWK_CSS}</style>
      <div ref={ref} className="twk" style={{ right:16, bottom:16 }}>
        <div className="twk-hd" onMouseDown={onDrag}>
          <b>Appearance</b>
          <button className="twk-x" onClick={onClose}>✕</button>
        </div>
        <div className="twk-body">{children}</div>
      </div>
    </>
  );
}

// ── edge geometry ─────────────────────────────────────────────────────────────
function curve(p0, p1) {
  const dx = Math.abs(p1.x - p0.x);
  const off = Math.max(64, dx * .46);
  const c0 = { x: p0.x + off, y: p0.y }, c1 = { x: p1.x - off, y: p1.y };
  const d = `M ${p0.x} ${p0.y} C ${c0.x} ${c0.y} ${c1.x} ${c1.y} ${p1.x} ${p1.y}`;
  const mid = {
    x: .125*p0.x + .375*c0.x + .375*c1.x + .125*p1.x,
    y: .125*p0.y + .375*c0.y + .375*c1.y + .125*p1.y,
  };
  return { d, mid };
}

function EdgePath({ p0, p1, color, sel, dim, amt, style, onSel }) {
  const { d } = curve(p0, p1);
  const w = Math.max(1.4, Math.min(2.6, 1.2 + Math.sqrt(Math.max(0, amt)) / 40));
  const cls = style === 'solid' ? 'e-solid' : style === 'dots' ? 'e-dots' : 'e-snake';
  return (
    <g className={'edge' + (dim ? ' dim' : '')} onMouseDown={e => { e.stopPropagation(); onSel(); }}>
      <path d={d} stroke="transparent" strokeWidth={22} fill="none" style={{ cursor:'pointer' }} />
      {sel && <path d={d} stroke={color.l} strokeWidth={w+8} strokeLinecap="round" fill="none" opacity=".18" />}
      {sel && <path d={d} stroke={color.l} strokeWidth={w+3} strokeLinecap="round" fill="none" opacity=".35" />}
      <path className={cls} d={d} stroke={color.l} strokeWidth={sel ? w+.8 : w} strokeLinecap="round" fill="none" />
    </g>
  );
}

function EdgePill({ p0, p1, mode, value, amt, pctEq, color, sel, onChange, onDel, onSel }) {
  const { mid } = curve(p0, p1);
  const [ed, setEd] = React.useState(false);
  const [draft, setDraft] = React.useState('');
  const inp = React.useRef(null);
  React.useEffect(() => { if (ed && inp.current) { inp.current.focus(); inp.current.select(); } }, [ed]);
  const commit = () => { const n = parseFloat(String(draft).replace(/[^0-9.]/g,'')); if(!isNaN(n)) onChange(n); setEd(false); };
  const primary   = mode === '%' ? fmtPct(value) : fmt$(value, value%1!==0);
  const secondary = mode === '%' ? fmt$(amt)     : fmtPct(pctEq);
  return (
    <div className={'pill' + (sel ? ' sel' : '')}
         style={{ left:mid.x, top:mid.y, '--pi':color.l }}
         onMouseDown={e => { e.stopPropagation(); onSel(); }}>
      {ed ? (
        <div className="pill-edit">
          {mode==='$' && <span className="pill-unit">$</span>}
          <input ref={inp} value={draft} onChange={e=>setDraft(e.target.value)}
            onBlur={commit} onKeyDown={e => { if(e.key==='Enter') commit(); if(e.key==='Escape') setEd(false); }}
            inputMode="decimal" />
          {mode==='%' && <span className="pill-unit">%</span>}
        </div>
      ) : (
        <button className="pill-face" onClick={e => { e.stopPropagation(); setDraft(String(value)); setEd(true); }}>
          <span className="pill-main">{primary}</span>
          <span className="pill-sub">{secondary}</span>
        </button>
      )}
      {sel && (
        <button className="pill-del" onMouseDown={e => { e.stopPropagation(); onDel(); }}>
          <svg viewBox="0 0 24 24" width="10" height="10"><path d="M6 6l12 12M18 6L6 18" stroke="#fff" strokeWidth="2.6" strokeLinecap="round" fill="none"/></svg>
        </button>
      )}
    </div>
  );
}

                  onClick={e => { e.stopPropagation(); onDel(); }}>
            <svg viewBox="0 0 24 24" width="11" height="11" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round">
              <path d="M3 6h18M8 6V4h8v2M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/>
            </svg>
          </button>
        )}
      </div>

      {/* body */}
      <div className="n-body">
        {isInc ? (
          <label className="inc-amount" data-nodrag onMouseDown={e => e.stopPropagation()}>
            <span className="inc-cur">$</span>
            <input className="inc-input" inputMode="decimal" value={node.amount}
              onChange={e => onAmt(e.target.value.replace(/[^0-9.]/g,''))} />
          </label>
        ) : editAmt ? (
          <div className="bkt-amount-wrap" data-nodrag onMouseDown={e => e.stopPropagation()}>
            <span className="bkt-cur">$</span>
            <input ref={amtRef} className="bkt-input" inputMode="decimal"
              value={amtDraft} onChange={e => setAmtDraft(e.target.value.replace(/[^0-9.]/g,''))}
              onBlur={commitAmt}
              onKeyDown={e => { if(e.key==='Enter') commitAmt(); if(e.key==='Escape') setEditAmt(false); }} />
          </div>
        ) : !hasRcv ? (
          <div className="bkt-empty" data-nodrag>
            <div className="bkt-empty-icon">
              <svg viewBox="0 0 24 24" width="10" height="10" fill="none" stroke="currentColor" strokeWidth="2.2" strokeLinecap="round">
                <path d="M12 5v14M5 12h14"/>
              </svg>
            </div>
            Drag a line here to receive money
          </div>
        ) : (
          <div className="bkt-amount" title="Click to set a target amount"
               onClick={() => { setAmtDraft(Math.round(avail).toString()); setEditAmt(true); }}>
            {fmt$(avail, { cents })}
          </div>
        )}

        <div className="n-meter">
          <div className={'n-meter-fill' + (over?' over':'')} style={{ width:(over?100:pct*100)+'%' }} />
        </div>

        <div className="n-foot">
          <div className="mode-pill" data-nodrag onMouseDown={e => e.stopPropagation()}>
            <button className={node.mode==='%'?'active':''} onClick={e => { e.stopPropagation(); onMode('%'); }}>%</button>
            <button className={node.mode==='$'?'active':''} onClick={e => { e.stopPropagation(); onMode('$'); }}>$</button>
          </div>
          <div className={'leftover ' + loCls}>
            <span className="lo-label">{loLabel}</span>
            <span className="lo-value">{fmt$(Math.abs(left), { cents })}</span>
          </div>
        </div>
      </div>

      {/* output handle */}
      <div className="handle h-out" data-nodrag title="Drag to connect"
           onMouseDown={e => { e.stopPropagation(); onConnStart(node, e); }}>
        <div className="h-out-label">Connect</div>
        <div className="h-out-dot" />
      </div>
    </div>
  );
}

// ── canvas ────────────────────────────────────────────────────────────────────
function Canvas({ nodes, edges, flow, sel, api, t }) {
  const wrapRef = React.useRef(null);
  const [view, setView] = React.useState({ x:40, y:20, z:1 });
  const drag = React.useRef(null);
  const [conn, setConn] = React.useState(null);
  const [hover, setHover] = React.useState(null);

  const toC = (cx, cy) => {
    const r = wrapRef.current.getBoundingClientRect();
    return { x:(cx-r.left-view.x)/view.z, y:(cy-r.top-view.y)/view.z };
  };

  React.useEffect(() => {
    const mv = e => {
      const d = drag.current;
      if (d?.kind==='pan') {
        setView(v => ({ ...v, x:d.ox+(e.clientX-d.sx), y:d.oy+(e.clientY-d.sy) }));
      } else if (d?.kind==='node') {
        const p = toC(e.clientX, e.clientY);
        api.move(d.id, Math.round(d.nx+(p.x-d.px)), Math.round(d.ny+(p.y-d.py)));
      } else if (conn) {
        const p = toC(e.clientX, e.clientY);
        setConn(c => c && { ...c, cur:p });
        const el = document.elementFromPoint(e.clientX, e.clientY);
        const host = el && el.closest('[data-node-id]');
        const tid = host ? host.getAttribute('data-node-id') : null;
        setHover(tid && tid !== conn.from ? tid : null);
      }
    };
    const up = e => {
      if (conn) {
        const el = document.elementFromPoint(e.clientX, e.clientY);
        const host = el && el.closest('[data-node-id]');
        const tid = host ? host.getAttribute('data-node-id') : null;
        const p = toC(e.clientX, e.clientY);
        const moved = conn.start ? Math.hypot(p.x-conn.start.x, p.y-conn.start.y) : 99;
        if (tid && tid !== conn.from) api.edge(conn.from, tid);
        else if (!tid && moved>12 && !(el && el.closest('.toolbar,.hint-bar,.twk'))) api.bucketAt(conn.from, p.x, p.y);
        setConn(null); setHover(null);
      }
      drag.current = null;
      document.body.classList.remove('grabbing');
    };
    window.addEventListener('mousemove', mv);
    window.addEventListener('mouseup', up);
    return () => { window.removeEventListener('mousemove',mv); window.removeEventListener('mouseup',up); };
  }, [conn, view, api]);

  const onBg = e => {
    if (e.button !== 0) return;
    api.sel(null);
    drag.current = { kind:'pan', sx:e.clientX, sy:e.clientY, ox:view.x, oy:view.y };
    document.body.classList.add('grabbing');
  };
  const onND = (node, e) => {
    if (e.target.closest('[data-nodrag]')) return;
    e.stopPropagation();
    const p = toC(e.clientX, e.clientY);
    drag.current = { kind:'node', id:node.id, nx:node.x, ny:node.y, px:p.x, py:p.y };
  };
  const onWheel = e => {
    e.preventDefault();
    const r = wrapRef.current.getBoundingClientRect();
    const sx = e.clientX-r.left, sy = e.clientY-r.top;
    setView(v => {
      const nz = Math.max(.3, Math.min(2.2, v.z*(e.deltaY<0?1.08:.926)));
      const cx=(sx-v.x)/v.z, cy=(sy-v.y)/v.z;
      return { z:nz, x:sx-cx*nz, y:sy-cy*nz };
    });
  };

  React.useEffect(() => {
    api._setView = setView;
    api._spawn = () => {
      const r = wrapRef.current.getBoundingClientRect();
      const c = toC(r.left+r.width*.42, r.top+r.height*.4);
      return { x:Math.round(c.x), y:Math.round(c.y) };
    };
  }, [api, view]);

  const selEdge = sel?.type === 'edge';

  return (
    <div ref={wrapRef} className={'canvas grid-'+(t.grid||'dots')+(conn?' connecting':'')}
         onMouseDown={onBg} onWheel={onWheel}>
      <div className="board" style={{ transform:`translate(${view.x}px,${view.y}px) scale(${view.z})` }}>
        <div className="grid-bg" />

        <svg className="edge-svg" width="14000" height="14000">
          {edges.map(ed => {
            const a = nodes.find(n=>n.id===ed.from), b = nodes.find(n=>n.id===ed.to);
            if (!a||!b) return null;
            const color = colorFor(a.type==='income' ? 'emerald' : a.color, t.theme);
            const isSel = sel?.type==='edge' && sel.id===ed.id;
            return <EdgePath key={ed.id} p0={hPos(a,'out')} p1={hPos(b,'in')}
              color={color} sel={isSel} dim={selEdge && !isSel}
              amt={flow.eAmt[ed.id]||0} style={t.edge}
              onSel={() => api.sel({ type:'edge', id:ed.id })} />;
          })}
          {conn && (() => {
            const a = nodes.find(n=>n.id===conn.from);
            const col = colorFor(a.type==='income'?'emerald':a.color, t.theme);
            const g = curve(hPos(a,'out'), conn.cur);
            return <path className="e-temp" d={g.d} stroke={col.l} strokeWidth="2" fill="none" strokeLinecap="round" />;
          })()}
        </svg>

        {nodes.map(node => {
          const color = colorFor(node.type==='income'?'emerald':node.color, t.theme);
          const isSel = sel?.type==='node' && sel.id===node.id;
          return (
            <div key={node.id} onMouseDown={e => onND(node, e)}>
              <Node node={node} color={color}
                rcv={flow.rcv[node.id]||0} alloc={flow.alloc[node.id]||0} left={flow.left[node.id]||0}
                sel={isSel} dropTarget={hover===node.id} connecting={!!conn}
                cents={t.cents} autoName={isSel && sel?.autoName}
                onSel={() => api.sel({ type:'node', id:node.id })}
                onRename={v => api.rename(node.id, v)}
                onMode={m => api.mode(node.id, m)}
                onAmt={v => api.amt(node.id, v)}
                onTargetAmt={target => api.targetAmt(node.id, target)}
                onDel={() => api.del(node.id)}
                onColor={() => api.color(node.id)}
                onConnStart={(n,e) => { const p=toC(e.clientX,e.clientY); setConn({ from:n.id, cur:p, start:p }); }}
                onConnEnd={n => { if(conn&&n.id!==conn.from) api.edge(conn.from, n.id); }}
              />
            </div>
          );
        })}

        <div className="pills">
          {edges.map(ed => {
            const a = nodes.find(n=>n.id===ed.from), b = nodes.find(n=>n.id===ed.to);
            if (!a||!b) return null;
            const color = colorFor(a.type==='income'?'emerald':a.color, t.theme);
            const amt = flow.eAmt[ed.id]||0;
            const avail = a.type==='income' ? (Number(a.amount)||0) : (flow.rcv[a.id]||0);
            const pctEq = avail>0 ? (amt/avail)*100 : 0;
            const isSel = sel?.type==='edge' && sel.id===ed.id;
            return <EdgePill key={ed.id} p0={hPos(a,'out')} p1={hPos(b,'in')}
              mode={a.mode} value={ed.value} amt={amt} pctEq={pctEq} color={color} sel={isSel}
              onChange={v => api.edgeVal(ed.id, v)}
              onDel={() => api.delEdge(ed.id)}
              onSel={() => api.sel({ type:'edge', id:ed.id })} />;
          })}
        </div>
      </div>
    </div>
  );
}

// ── App ───────────────────────────────────────────────────────────────────────
const THEMES = { dark:'Dark', light:'Light', midnight:'Midnight', sand:'Sand' };
const TWK_DEF = { theme:'light', edge:'snake', grid:'dots', cents:false };

function Brand() {
  return (
    <div className="brand">
      <div className="brand-mark">
        <svg viewBox="0 0 32 32" width="19" height="19" fill="none">
          <circle cx="7" cy="9" r="3.2" stroke="currentColor" strokeWidth="2.2"/>
          <circle cx="25" cy="7" r="2.5" stroke="currentColor" strokeWidth="2.2"/>
          <circle cx="24" cy="24" r="2.5" stroke="currentColor" strokeWidth="2.2"/>
          <path d="M10 10.5C16 13 14 20 22 23M9.6 11.2C14 12 18 9.5 22.4 7.6"
                stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeDasharray=".1 4"/>
        </svg>
      </div>
      <span className="brand-name">money<em>flow</em></span>
    </div>
  );
}

function App() {
  const [t, setTweak] = useTweaks(TWK_DEF);
  const [graph, setGraph] = React.useState(() => PRESETS.fifty.build());
  const [sel, setSel] = React.useState(null);
  const [presetKey, setPresetKey] = React.useState('fifty');
  const [tweaksOpen, setTweaksOpen] = React.useState(false);

  const flow = React.useMemo(() => computeFlow(graph.nodes, graph.edges), [graph]);

  const api = React.useRef({}).current;

  api.sel = s => setSel(s);

  api.move = (id, x, y) => setGraph(g => ({ ...g, nodes:g.nodes.map(n => n.id===id?{...n,x,y}:n) }));

  api.rename = (id, name) => setGraph(g => ({ ...g, nodes:g.nodes.map(n => n.id===id?{...n,name}:n) }));

  api.amt = (id, amount) => setGraph(g => ({ ...g, nodes:g.nodes.map(n => n.id===id?{...n,amount}:n) }));

  api.targetAmt = (id, target) => setGraph(g => {
    const f = computeFlow(g.nodes, g.edges);
    const inE = g.edges.filter(e => e.to===id);
    if (!inE.length) return g;
    const total = inE.reduce((s,e) => s+(f.eAmt[e.id]||0), 0);
    return { ...g, edges: g.edges.map(e => {
      const ie = inE.find(x => x.id===e.id); if(!ie) return e;
      const src = g.nodes.find(n => n.id===e.from);
      const sAvail = src.type==='income' ? (Number(src.amount)||0) : (f.rcv[src.id]||0);
      const portion = total>0 ? (f.eAmt[e.id]||0)/total : 1/inE.length;
      const tAmt = target * portion;
      const val = src.mode==='%' ? (sAvail>0 ? Math.round((tAmt/sAvail)*1000)/10 : 0) : Math.round(tAmt*100)/100;
      return { ...e, value:val };
    })};
  });

  api.color = id => setGraph(g => {
    const n = g.nodes.find(x=>x.id===id); if(!n) return g;
    const i = PAL.findIndex(p=>p.key===n.color);
    return { ...g, nodes:g.nodes.map(x=>x.id===id?{...x,color:PAL[(i+1)%PAL.length].key}:x) };
  });

  api.mode = (id, mode) => setGraph(g => {
    const node = g.nodes.find(n=>n.id===id); if(!node||node.mode===mode) return g;
    const f = computeFlow(g.nodes, g.edges);
    const avail = node.type==='income' ? (Number(node.amount)||0) : (f.rcv[id]||0);
    const edges = g.edges.map(e => {
      if (e.from!==id) return e;
      const amt = f.eAmt[e.id]||0;
      const value = mode==='%' ? (avail>0?Math.round((amt/avail)*1000)/10:0) : Math.round(amt);
      return { ...e, value };
    });
    return { ...g, edges, nodes:g.nodes.map(n=>n.id===id?{...n,mode}:n) };
  });

  api.edge = (from, to) => setGraph(g => {
    if (from===to) return g;
    const tgt = g.nodes.find(n=>n.id===to); if(!tgt||tgt.type==='income') return g;
    if (g.edges.some(e=>e.from===from&&e.to===to)) return g;
    const src = g.nodes.find(n=>n.id===from);
    const f = computeFlow(g.nodes, g.edges);
    const avail = src.type==='income'?(Number(src.amount)||0):(f.rcv[from]||0);
    const rem = Math.max(0, avail-(f.alloc[from]||0));
    const value = src.mode==='%' ? (avail>0?Math.max(0,Math.round((rem/avail)*100)):0) : Math.round(rem);
    const e = { id:uid('e'), from, to, value };
    setSel({ type:'edge', id:e.id });
    return { ...g, edges:[...g.edges, e] };
  });

  api.edgeVal = (id, value) => setGraph(g => ({ ...g, edges:g.edges.map(e=>e.id===id?{...e,value}:e) }));

  api.delEdge = id => { setGraph(g => ({ ...g, edges:g.edges.filter(e=>e.id!==id) })); setSel(null); };

  api.del = id => setGraph(g => {
    const n = g.nodes.find(x=>x.id===id); if(!n||n.type==='income') return g;
    setSel(null);
    return { nodes:g.nodes.filter(x=>x.id!==id), edges:g.edges.filter(e=>e.from!==id&&e.to!==id) };
  });

  api.add = () => setGraph(g => {
    const sp = api._spawn ? api._spawn() : { x:500, y:300 };
    let x = sp.x - NODE_W/2, y = sp.y - 70;
    for (let i=0; i<16; i++) {
      if (!g.nodes.some(n => Math.abs(n.x-x)<NODE_W+24 && Math.abs(n.y-y)<190)) break;
      y += 200;
    }
    const used = g.nodes.filter(n=>n.type==='bucket').length;
    const node = { id:uid('n'), type:'bucket', name:'New Bucket', icon:'coins', color:PAL[used%PAL.length].key, mode:'%', x, y };
    setSel({ type:'node', id:node.id, autoName:true });
    return { ...g, nodes:[...g.nodes, node] };
  });

  api.bucketAt = (from, x, y) => setGraph(g => {
    const src = g.nodes.find(n=>n.id===from); if(!src) return g;
    const used = g.nodes.filter(n=>n.type==='bucket').length;
    const node = { id:uid('n'), type:'bucket', name:'New Bucket', icon:'coins', color:PAL[used%PAL.length].key, mode:'%',
      x:Math.round(x), y:Math.round(y-HDY) };
    const f = computeFlow(g.nodes, g.edges);
    const avail = src.type==='income'?(Number(src.amount)||0):(f.rcv[from]||0);
    const rem = Math.max(0, avail-(f.alloc[from]||0));
    const value = src.mode==='%' ? (avail>0?Math.max(0,Math.round((rem/avail)*100)):0) : Math.round(rem);
    const e = { id:uid('e'), from, to:node.id, value };
    setSel({ type:'node', id:node.id, autoName:true });
    return { nodes:[...g.nodes, node], edges:[...g.edges, e] };
  });

  api.load = key => { setPresetKey(key); setGraph(PRESETS[key].build()); setSel(null); if(api._setView) api._setView({x:40,y:20,z:1}); };
  api.recenter = () => { if (api._setView) api._setView({x:40,y:20,z:1}); };

  React.useEffect(() => {
    const onKey = e => {
      const typing = /^(INPUT|TEXTAREA)$/.test(document.activeElement?.tagName);
      if (e.key==='Escape') { setSel(null); document.activeElement?.blur(); return; }
      if ((e.key==='Delete'||e.key==='Backspace') && !typing && sel) {
        e.preventDefault();
        if (sel.type==='edge') api.delEdge(sel.id);
        else api.del(sel.id);
      }
    };
    window.addEventListener('keydown', onKey);
    return () => window.removeEventListener('keydown', onKey);
  }, [sel]);

  const summary = React.useMemo(() => {
    let income=0, assigned=0;
    graph.nodes.forEach(n => { if(n.type==='income'){ income+=Number(n.amount)||0; assigned+=flow.alloc[n.id]||0; } });
    return { income, assigned, free:income-assigned };
  }, [graph, flow]);

  const freeState = Math.abs(summary.free)<.5 ? 's-good' : summary.free<0 ? 's-bad' : 's-warn';

  return (
    <div className="app" data-theme={t.theme}>
      <header className="toolbar">
        <Brand />
        <div className="tb-divider" />
        <div className="tb-actions">
          <label className="preset-wrap">
            <svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round">
              <path d="M4 6h16M4 12h10M4 18h7"/>
            </svg>
            <select value={presetKey} onChange={e => api.load(e.target.value)}>
              {Object.keys(PRESETS).map(k => <option key={k} value={k}>{PRESETS[k].label}</option>)}
            </select>
          </label>

          <button className="tb-btn solid" onClick={() => api.add()}>
            <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" strokeWidth="2.4" strokeLinecap="round">
              <path d="M12 5v14M5 12h14"/>
            </svg>
            Add bucket
          </button>

          <button className="tb-btn outline" onClick={() => api.recenter()} title="Fit all nodes">
            <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round">
              <path d="M4 8V5a1 1 0 0 1 1-1h3M4 16v3a1 1 0 0 0 1 1h3M16 4h3a1 1 0 0 1 1 1v3M16 20h3a1 1 0 0 0 1-1v-3"/>
              <circle cx="12" cy="12" r="3"/>
            </svg>
          </button>

          <button className="tb-btn outline" onClick={() => setTweaksOpen(v => !v)} title="Appearance">
            <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round">
              <circle cx="12" cy="12" r="3"/>
              <path d="M19.07 4.93A10 10 0 0 0 4.93 19.07M4.93 4.93a10 10 0 0 0 0 14.14"/>
            </svg>
          </button>
        </div>

        <div className="tb-spacer" />

        <div className="summary">
          <div className="sum-chip">
            <span className="sum-label">Take-home</span>
            <span className="sum-value">{fmt$(summary.income)}</span>
          </div>
          <div className="sum-chip">
            <span className="sum-label">Assigned</span>
            <span className="sum-value">{fmt$(summary.assigned)}</span>
          </div>
          <div className={'sum-chip ' + freeState}>
            <span className="sum-label">{summary.free < -.5 ? 'Over budget' : 'Unassigned'}</span>
            <span className="sum-value">{fmt$(Math.abs(summary.free))}</span>
          </div>
        </div>
      </header>

      <Canvas nodes={graph.nodes} edges={graph.edges} flow={flow} sel={sel} api={api} t={t} />

      <div className="hint-bar">
        <span><b>Drag</b> card to move · <b>right dot</b> to connect</span>
        <span><b>Click</b> amount or pill to edit</span>
        <span><b>Del</b> removes selection · scroll to zoom</span>
      </div>

      <Tweaks open={tweaksOpen} onClose={() => setTweaksOpen(false)}>
        <TwkSec label="Theme" />
        <TwkSel label="Color scheme" value={t.theme}
          options={Object.keys(THEMES).map(k => ({ value:k, label:THEMES[k] }))}
          onChange={v => setTweak('theme', v)} />
        <TwkSec label="Canvas" />
        <TwkSeg label="Flow lines" value={t.edge} options={['snake','dots','solid']} onChange={v => setTweak('edge', v)} />
        <TwkSeg label="Grid" value={t.grid} options={['dots','lines','none']} onChange={v => setTweak('grid', v)} />
        <TwkTog label="Show cents" value={t.cents} onChange={v => setTweak('cents', v)} />
      </Tweaks>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>moneyflow — paycheck distribution canvas</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
<style>
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
:root { --font: "Plus Jakarta Sans", ui-sans-serif, system-ui, sans-serif; }
body { font-family: var(--font); -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility; }
body.grabbing * { cursor: grabbing !important; }
#root { height: 100%; }

/* ── theme tokens ── */
.app { height: 100%; display: flex; flex-direction: column; overflow: hidden; background: var(--bg); color: var(--ink); }
.app[data-theme="cloud"] {
  --bg:#F0F4FA; --canvas:#F0F4FA; --grid:#D4DDED; --ink:#0D1829; --muted:#5C6E88;
  --line:#DDE4F0; --card:#FFFFFF; --card-line:#E5EBF5; --accent:#10B981; --accent-soft:#ECFDF5;
  --toolbar:#FFFFFFf0; --shadow:0 12px 32px -12px rgba(15,35,75,.22), 0 2px 8px -3px rgba(15,35,75,.10);
  --r-card:20px;
}
.app[data-theme="mint"] {
  --bg:#E8F3ED; --canvas:#E8F3ED; --grid:#C8E2D3; --ink:#0F2419; --muted:#527060;
  --line:#D2E6DB; --card:#FFFFFF; --card-line:#DCEEE3; --accent:#0E9F6E; --accent-soft:#E7F8EF;
  --toolbar:#FBFEFCf0; --shadow:0 12px 28px -12px rgba(14,65,40,.24), 0 2px 7px -3px rgba(14,65,40,.10);
  --r-card:22px;
}
.app[data-theme="paper"] {
  --bg:#F4EEE2; --canvas:#F5EFE5; --grid:#E0D5BF; --ink:#28200F; --muted:#82735A;
  --line:#E4D9C6; --card:#FFFDF7; --card-line:#E9DFCD; --accent:#C2761F; --accent-soft:#FBEFDC;
  --toolbar:#FCF8EEf0; --shadow:0 12px 28px -12px rgba(80,58,16,.24), 0 2px 6px -3px rgba(80,58,16,.12);
  --r-card:14px;
}
.app[data-theme="slate"] {
  --bg:#E8ECF3; --canvas:#E5E9F1; --grid:#CDD5E2; --ink:#0C1422; --muted:#55647A;
  --line:#D8E0EB; --card:#FFFFFF; --card-line:#E2E8F2; --accent:#4F46E5; --accent-soft:#EEF1FE;
  --toolbar:#FFFFFFf0; --shadow:0 10px 24px -10px rgba(18,28,58,.26), 0 1px 4px -1px rgba(18,28,58,.14);
  --r-card:12px;
}

/* ── toolbar ── */
.toolbar {
  flex: 0 0 auto; height: 58px; display: flex; align-items: center; gap: 10px;
  padding: 0 16px; background: var(--toolbar); backdrop-filter: blur(14px);
  border-bottom: 1px solid var(--line); z-index: 30; position: relative;
}
.brand { display: flex; align-items: center; gap: 9px; }
.brand-mark {
  width: 34px; height: 34px; border-radius: 10px; display: grid; place-items: center;
  background: var(--accent); color: #fff; box-shadow: 0 4px 12px -4px color-mix(in srgb, var(--accent) 60%, transparent);
}
.brand-text { font-weight: 700; font-size: 17px; letter-spacing: -.025em; color: var(--ink); }
.brand-text span { color: var(--accent); }
.tb-sep { width: 1px; height: 24px; background: var(--line); }
.tb-row { display: flex; align-items: center; gap: 6px; }
.tb-space { flex: 1; }

.tb-btn {
  display: inline-flex; align-items: center; gap: 6px; height: 36px; padding: 0 13px;
  border-radius: 10px; font-family: var(--font); font-weight: 600; font-size: 13px;
  cursor: pointer; border: none; transition: opacity .1s, transform .08s, box-shadow .15s;
  white-space: nowrap;
}
.tb-btn:active { transform: translateY(1px); opacity: .88; }
.tb-btn.primary { background: var(--accent); color: #fff; box-shadow: 0 6px 14px -6px color-mix(in srgb, var(--accent) 70%, transparent); }
.tb-btn.primary:hover { filter: brightness(1.05); }
.tb-btn.ghost {
  background: var(--card); color: var(--muted); border: 1px solid var(--line);
  width: 36px; padding: 0; justify-content: center;
}
.tb-btn.ghost:hover { color: var(--ink); background: var(--bg); }

.preset-wrap {
  position: relative; display: inline-flex; align-items: center; height: 36px;
  border: 1px solid var(--line); border-radius: 10px; background: var(--card);
  padding: 0 8px 0 10px; gap: 4px;
}
.preset-wrap svg { color: var(--muted); flex-shrink: 0; }
.preset-wrap select {
  appearance: none; border: 0; background: transparent; font-family: var(--font);
  font-weight: 600; font-size: 13px; color: var(--ink); padding: 0 20px 0 2px; height: 100%; cursor: pointer; outline: none;
}
.preset-wrap::after {
  content: ""; position: absolute; right: 10px; width: 7px; height: 7px; pointer-events: none;
  border-right: 2px solid var(--muted); border-bottom: 2px solid var(--muted); transform: rotate(45deg) translateY(-2px);
}

/* summary */
.summary { display: flex; align-items: center; gap: 12px; }
.sum-item { display: flex; flex-direction: column; align-items: flex-end; line-height: 1.1; }
.sum-lbl { font-size: 10px; font-weight: 600; letter-spacing: .05em; text-transform: uppercase; color: var(--muted); white-space: nowrap; }
.sum-val { font-size: 14px; font-weight: 700; letter-spacing: -.02em; font-variant-numeric: tabular-nums; color: var(--ink); }
.sum-sep { width: 1px; height: 24px; background: var(--line); }
.sum-item.unassigned.ok .sum-val { color: var(--accent); }
.sum-item.unassigned.warn .sum-val { color: #D97706; }
.sum-item.unassigned.over .sum-val, .sum-item.unassigned.over .sum-lbl { color: #E11D48; }

/* ── canvas ── */
.canvas { flex: 1 1 auto; position: relative; overflow: hidden; background: var(--canvas); cursor: grab; }
.canvas.is-connecting { cursor: crosshair; }
.board { position: absolute; left: 0; top: 0; transform-origin: 0 0; will-change: transform; }
.grid-bg { position: absolute; left: -8000px; top: -8000px; width: 24000px; height: 24000px; pointer-events: none; }
.grid-dots .grid-bg {
  background-image: radial-gradient(circle, var(--grid) 1.4px, transparent 1.5px);
  background-size: 24px 24px;
}
.grid-lines .grid-bg {
  background-image: linear-gradient(var(--grid) 1px, transparent 1px), linear-gradient(90deg, var(--grid) 1px, transparent 1px);
  background-size: 24px 24px; opacity: .65;
}
.grid-none .grid-bg { background: none; }

/* ── edges ── */
.edge-layer { position: absolute; left: 0; top: 0; overflow: visible; pointer-events: none; }
.edge { pointer-events: auto; }
.edge.is-dim { opacity: .3; }
.edge-snake { stroke-dasharray: 5 6; animation: march .9s linear infinite; }
.edge-dots { stroke-dasharray: 0.1 8; stroke-linecap: round; animation: march 1.1s linear infinite; }
.edge-solid { stroke-dasharray: none; }
@keyframes march { to { stroke-dashoffset: -11; } }
@media (prefers-reduced-motion: reduce) { .edge-snake, .edge-dots { animation: none; } }
.edge-temp { stroke-dasharray: 6 6; opacity: .75; animation: march .8s linear infinite; pointer-events: none; }

/* edge pill */
.pill-layer { position: absolute; left: 0; top: 0; pointer-events: none; }
.edge-pill { position: absolute; transform: translate(-50%, -50%); z-index: 5; pointer-events: auto; }
.edge-pill-face {
  display: flex; flex-direction: column; align-items: center; gap: 0; line-height: 1.1;
  padding: 5px 10px; border-radius: 999px; cursor: pointer; font-family: var(--font);
  background: var(--card); border: 1.5px solid var(--pill-ring);
  box-shadow: 0 3px 8px -4px rgba(20,40,80,.22); transition: transform .1s, box-shadow .12s;
}
.edge-pill-face:hover { transform: translateY(-1px) scale(1.03); box-shadow: 0 6px 14px -5px rgba(20,40,80,.28); }
.edge-pill-primary { font-weight: 700; font-size: 11.5px; color: var(--pill-ink); font-variant-numeric: tabular-nums; }
.edge-pill-secondary { font-weight: 500; font-size: 9px; color: var(--muted); font-variant-numeric: tabular-nums; }
.edge-pill.is-sel .edge-pill-face { border-color: var(--pill-ink); box-shadow: 0 0 0 3px var(--pill-soft), 0 4px 12px -4px rgba(20,40,80,.26); }
.edge-pill-edit {
  display: inline-flex; align-items: center; gap: 1px; background: var(--card);
  border: 1.5px solid var(--pill-ink); border-radius: 999px; padding: 4px 10px;
  box-shadow: 0 0 0 3px var(--pill-soft);
}
.edge-pill-edit input {
  width: 52px; border: 0; outline: 0; background: transparent; font-family: var(--font);
  font-weight: 700; font-size: 12px; color: var(--pill-ink); text-align: center; font-variant-numeric: tabular-nums;
}
.edge-pill-unit { font-weight: 700; font-size: 12px; color: var(--pill-ink); }
.edge-pill-del {
  position: absolute; top: -8px; right: -8px; width: 18px; height: 18px; border-radius: 50%;
  border: 0; background: #E11D48; color: #fff; display: grid; place-items: center; cursor: pointer;
  box-shadow: 0 2px 6px -2px rgba(225,29,72,.45);
}

/* ── node card ── */
.node {
  position: absolute; width: 244px; background: var(--card); border: 1.5px solid var(--card-line);
  border-radius: var(--r-card); box-shadow: var(--shadow); user-select: none;
  transition: box-shadow .15s, border-color .15s, transform .06s;
}
.node:hover { box-shadow: 0 18px 36px -14px rgba(20,40,80,.28), 0 3px 8px -3px rgba(20,40,80,.12); }
.node.is-sel { border-color: var(--c-line); box-shadow: 0 0 0 3.5px var(--c-ring), var(--shadow); }
.node.is-target { border-color: var(--accent); box-shadow: 0 0 0 3.5px var(--accent-soft), var(--shadow); }
.node.is-income { border-color: color-mix(in srgb, var(--accent) 30%, transparent); }

/* drag handle strip at top */
.node-drag-strip {
  height: 24px; display: flex; align-items: center; justify-content: center;
  cursor: grab; border-radius: var(--r-card) var(--r-card) 0 0;
  transition: background .12s;
}
.node-drag-strip:hover { background: var(--bg); }
.node-drag-strip svg { color: var(--muted); opacity: .45; pointer-events: none; }
.node:active .node-drag-strip { cursor: grabbing; }

.node-head { display: flex; align-items: center; gap: 8px; padding: 0 12px 10px; }
.node-chip {
  flex: 0 0 auto; width: 30px; height: 30px; border-radius: 9px; display: grid; place-items: center;
  background: var(--c-soft); color: var(--c-ink); border: 0; cursor: pointer;
  transition: transform .1s, filter .1s;
}
.node-chip:hover:not([disabled]) { transform: scale(1.08); filter: brightness(.95); }
.node.is-income .node-chip { background: var(--accent); color: #fff; cursor: default; pointer-events: none; }

.node-name {
  flex: 1 1 auto; min-width: 0; border: 0; background: transparent; outline: none;
  font-family: var(--font); font-weight: 600; font-size: 13.5px; color: var(--ink);
  letter-spacing: -.01em; padding: 3px 4px; border-radius: 6px; cursor: text;
}
.node-name-txt { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; line-height: 20px; cursor: text; }
.node-name.editing, .node-name:focus { background: var(--bg); box-shadow: inset 0 0 0 1.5px var(--line); }

/* delete button — always visible, subtle unless hovered */
.node-del {
  flex: 0 0 auto; width: 22px; height: 22px; border-radius: 6px; border: 1px solid var(--line);
  background: var(--bg); color: var(--muted); cursor: pointer; display: grid; place-items: center;
  transition: background .12s, border-color .12s, color .12s; opacity: .55;
}
.node:hover .node-del { opacity: 1; }
.node-del:hover { background: #FFF0F2; border-color: #FECDD3; color: #E11D48; }

.node-body { padding: 0 13px 12px; }

/* amount display / input */
.amount-row { display: flex; align-items: baseline; gap: 2px; padding: 1px 0 5px; }
.amount-cur { font-size: 14px; font-weight: 600; color: var(--muted); line-height: 1; }
.amount-input {
  flex: 1; min-width: 0; border: 0; outline: none; background: transparent; font-family: var(--font);
  font-weight: 700; font-size: 26px; letter-spacing: -.03em; color: var(--ink);
  font-variant-numeric: tabular-nums; padding: 0; line-height: 1.1;
}
/* bucket editable amount */
.bucket-amount {
  font-weight: 700; font-size: 24px; letter-spacing: -.03em; color: var(--ink);
  font-variant-numeric: tabular-nums; padding: 1px 0 5px; line-height: 1.2;
  border-radius: 8px; cursor: text; display: inline-block;
  transition: background .1s;
}
.bucket-amount:hover { background: var(--bg); padding-left: 4px; padding-right: 4px; margin-left: -4px; }
.bucket-amount.editable-hint::after {
  content: " ✎"; font-size: 12px; color: var(--muted); opacity: .6; vertical-align: middle;
}
.bucket-amount-input {
  font-family: var(--font); font-weight: 700; font-size: 24px; letter-spacing: -.03em;
  color: var(--ink); font-variant-numeric: tabular-nums; border: 0; outline: none;
  background: var(--bg); padding: 1px 6px 1px 4px; border-radius: 8px;
  box-shadow: inset 0 0 0 1.5px var(--c-line, var(--line)); width: 100%; line-height: 1.2;
  box-sizing: border-box;
}
.bucket-no-income {
  font-size: 11.5px; color: var(--muted); font-weight: 500; padding: 2px 0 6px;
  display: flex; align-items: center; gap: 5px; opacity: .75;
}

/* meter */
.node-meter { height: 5px; border-radius: 999px; background: var(--bg); overflow: hidden; margin-bottom: 1px; }
.node-meter-fill {
  height: 100%; border-radius: 999px; background: var(--c-line);
  background: linear-gradient(90deg, var(--c-line), color-mix(in srgb, var(--c-line) 75%, #fff));
  transition: width .3s cubic-bezier(.4,0,.2,1);
}
.node.is-income .node-meter-fill { background: linear-gradient(90deg, var(--accent), color-mix(in srgb, var(--accent) 70%, #7ee8c6)); }
.node-meter-fill.is-over { background: #E11D48; }

/* footer */
.node-foot { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-top: 10px; }
.mode-toggle { display: inline-flex; background: var(--bg); border-radius: 8px; padding: 2px; gap: 1px; border: 1px solid var(--line); }
.mode-toggle button {
  width: 28px; height: 24px; border: 0; border-radius: 6px; background: transparent; cursor: pointer;
  font-family: var(--font); font-weight: 600; font-size: 12.5px; color: var(--muted); transition: all .1s;
}
.mode-toggle button.on { background: var(--card); color: var(--ink); box-shadow: 0 1px 4px -1px rgba(20,40,80,.22); }
.leftover { display: flex; flex-direction: column; align-items: flex-end; line-height: 1.15; }
.leftover-lbl { font-size: 9px; font-weight: 700; letter-spacing: .05em; text-transform: uppercase; color: var(--muted); white-space: nowrap; }
.leftover-val { font-size: 12.5px; font-weight: 700; font-variant-numeric: tabular-nums; letter-spacing: -.01em; }
.leftover.l-good .leftover-val, .leftover.l-good .leftover-lbl { color: var(--accent); }
.leftover.l-warn .leftover-val { color: #D97706; }
.leftover.l-bad .leftover-val, .leftover.l-bad .leftover-lbl { color: #E11D48; }
.leftover.l-calm .leftover-val { color: var(--c-ink); }
.leftover.l-zero .leftover-val { color: var(--muted); }

/* ── connection handles ── */
.handle { position: absolute; top: 36px; display: grid; place-items: center; z-index: 4; }
.handle-out { right: -14px; width: 28px; height: 28px; cursor: crosshair; }
.handle-in  { left: -14px;  width: 28px; height: 28px; cursor: default; }
.handle-out-dot {
  width: 16px; height: 16px; border-radius: 50%; background: var(--card);
  border: 2.5px solid var(--c-line); box-shadow: 0 1px 4px rgba(20,40,80,.18);
  transition: transform .12s, background .12s, border-color .12s, box-shadow .12s;
}
.node.is-income .handle-out-dot { border-color: var(--accent); }
.handle-out:hover .handle-out-dot {
  transform: scale(1.45); background: var(--c-line); border-color: var(--c-line);
  box-shadow: 0 2px 8px rgba(20,40,80,.22);
}
.node.is-income .handle-out:hover .handle-out-dot { background: var(--accent); border-color: var(--accent); }
.handle-in-dot {
  width: 12px; height: 12px; border-radius: 50%; background: var(--card);
  border: 2px solid var(--line); opacity: .5;
  transition: transform .12s, background .12s, border-color .12s, opacity .12s;
}
.node.is-target .handle-in-dot { border-color: var(--accent); background: var(--accent); opacity: 1; transform: scale(1.3); }

/* connect tooltip */
.handle-out-tip {
  position: absolute; right: 32px; top: 50%; transform: translateY(-50%);
  background: var(--ink); color: #fff; font-size: 10px; font-weight: 600;
  padding: 3px 7px; border-radius: 5px; white-space: nowrap; pointer-events: none;
  opacity: 0; transition: opacity .15s; letter-spacing: .02em;
}
.handle-out-tip::after {
  content: ''; position: absolute; left: 100%; top: 50%; transform: translateY(-50%);
  border: 5px solid transparent; border-left-color: var(--ink);
}
.handle-out:hover .handle-out-tip { opacity: 1; }

/* ── hint bar ── */
.hint-bar {
  position: absolute; left: 50%; bottom: 14px; transform: translateX(-50%); z-index: 25;
  display: flex; gap: 16px; align-items: center; padding: 8px 16px; border-radius: 10px;
  background: var(--card); border: 1px solid var(--line); box-shadow: var(--shadow);
  font-size: 11.5px; color: var(--muted); white-space: nowrap;
}
.hint-bar b { color: var(--ink); }
.hint-bar span + span { border-left: 1px solid var(--line); padding-left: 16px; }
@media (max-width: 860px) { .hint-bar { display: none; } .sum-item:not(.unassigned), .sum-sep { display: none; } }

/* ── empty bucket state ── */
.bucket-empty-cta {
  font-size: 11px; color: var(--muted); font-weight: 500;
  display: flex; align-items: center; gap: 5px; padding: 3px 0 6px;
  opacity: .7;
}
.bucket-empty-cta svg { flex-shrink: 0; }
</style>
</head>

<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script type="text/babel">
// ─── Helpers ──────────────────────────────────────────────────────────────────
function fmtMoney(n, opts) {
  const showCents = opts && opts.cents;
  const v = Math.abs(n) < 0.005 ? 0 : n;
  return '$' + v.toLocaleString('en-US', {
    minimumFractionDigits: showCents ? 2 : 0,
    maximumFractionDigits: showCents ? 2 : 0,
  });
}
function fmtPct(n) {
  const v = Math.round(n * 10) / 10;
  return (Number.isInteger(v) ? v : v.toFixed(1)) + '%';
}
function uid(prefix) { return (prefix || 'id') + '_' + Math.random().toString(36).slice(2, 8); }

// ─── Palette & Icons ──────────────────────────────────────────────────────────
const PALETTE = [
  { key: 'emerald', soft: '#ECFDF5', ink: '#047857', line: '#10B981', ring: '#A7F3D0' },
  { key: 'sky',     soft: '#EFF6FF', ink: '#1D4ED8', line: '#3B82F6', ring: '#BFDBFE' },
  { key: 'violet',  soft: '#F5F3FF', ink: '#6D28D9', line: '#8B5CF6', ring: '#DDD6FE' },
  { key: 'amber',   soft: '#FFFBEB', ink: '#B45309', line: '#F59E0B', ring: '#FDE68A' },
  { key: 'rose',    soft: '#FFF1F2', ink: '#BE123C', line: '#F43F5E', ring: '#FECDD3' },
  { key: 'teal',    soft: '#F0FDFA', ink: '#0F766E', line: '#14B8A6', ring: '#99F6E4' },
  { key: 'indigo',  soft: '#EEF2FF', ink: '#4338CA', line: '#6366F1', ring: '#C7D2FE' },
  { key: 'fuchsia', soft: '#FDF4FF', ink: '#A21CAF', line: '#D946EF', ring: '#F5D0FE' },
];
function colorFor(key) { return PALETTE.find(p => p.key === key) || PALETTE[0]; }

const ICONS = {
  wallet:  'M3 7.5A2.5 2.5 0 0 1 5.5 5H17a2 2 0 0 1 2 2v0H5.5A2.5 2.5 0 0 1 3 7.5Zm0 0V17a2 2 0 0 0 2 2h13a2 2 0 0 0 2-2v-6a2 2 0 0 0-2-2H6m11.5 2.5h.01',
  home:    'M4 11.5 12 4l8 7.5M6 10v9a1 1 0 0 0 1 1h3v-5h4v5h3a1 1 0 0 0 1-1v-9',
  piggy:   'M16 8c2.5 0 4.5 2 4.5 4.5 0 1.4-.7 2.7-1.7 3.5l.7 2.5h-2.5l-.5-1.6c-.5.1-1 .1-1.5.1H11l-.6 1.5H8l.3-2.2C6.9 16.7 6 15 6 13.5 6 10.7 8.7 8 12 8h4Zm-1 3.5h.01M5.5 11.5C4.7 11.5 4 10.8 4 10s.7-1.5 1.5-1.5',
  cart:    'M4 5h2l1.5 9.5a1.5 1.5 0 0 0 1.5 1.3h7a1.5 1.5 0 0 0 1.5-1.2L20 8H7m2 11.5h.01M17 19.5h.01',

// ─── Flow math ────────────────────────────────────────────────────────────────
function computeFlow(nodes, edges) {
  const nodeMap = {}; nodes.forEach(n => { nodeMap[n.id] = n; });
  const out = {}, inc = {};
  nodes.forEach(n => { out[n.id] = []; inc[n.id] = []; });
  edges.forEach(e => {
    if (nodeMap[e.from] && nodeMap[e.to] && e.from !== e.to) {
      out[e.from].push(e); inc[e.to].push(e);
    }
  });
  const indeg = {}; nodes.forEach(n => { indeg[n.id] = inc[n.id].length; });
  const queue = nodes.filter(n => indeg[n.id] === 0).map(n => n.id);
  const order = [];
  while (queue.length) {
    const id = queue.shift(); order.push(id);
    out[id].forEach(e => { if (--indeg[e.to] === 0) queue.push(e.to); });
  }
  nodes.forEach(n => { if (!order.includes(n.id)) order.push(n.id); });
  const received = {}, allocated = {}, leftover = {}, edgeAmt = {};
  nodes.forEach(n => { received[n.id] = n.type === 'income' ? (Number(n.amount) || 0) : 0; });
  order.forEach(id => {
    const node = nodeMap[id]; const avail = received[id]; let alloc = 0;
    out[id].forEach(e => {
      let amt = node.mode === '%' ? avail * (Number(e.value) || 0) / 100 : (Number(e.value) || 0);
      if (amt < 0) amt = 0;
      edgeAmt[e.id] = amt; alloc += amt; received[e.to] = (received[e.to] || 0) + amt;
    });
    allocated[id] = alloc; leftover[id] = avail - alloc;
  });
  return { received, allocated, leftover, edgeAmt, out, inc };
}

function useTweaks(defaults) {
  const [v, setV] = React.useState(defaults);
  const set = React.useCallback((key, val) => setV(p => ({ ...p, [key]: val })), []);
  return [v, set];
}

function TweaksPanel({ open, onClose, children }) {
  const ref = React.useRef(null);
  const off = React.useRef({ x: 16, y: 16 });
  const clamp = React.useCallback(() => {
    const el = ref.current; if (!el) return;
    const mxR = Math.max(16, window.innerWidth - el.offsetWidth - 16);
    const mxB = Math.max(16, window.innerHeight - el.offsetHeight - 16);
    off.current = { x: Math.min(mxR, Math.max(16, off.current.x)), y: Math.min(mxB, Math.max(16, off.current.y)) };
    el.style.right = off.current.x + 'px'; el.style.bottom = off.current.y + 'px';
  }, []);
  React.useEffect(() => { if (open) { setTimeout(clamp, 0); } }, [open, clamp]);
  const drag = (e) => {
    const el = ref.current; if (!el) return;
    const r = el.getBoundingClientRect();
    const sx = e.clientX, sy = e.clientY;
    const sr = window.innerWidth - r.right, sb = window.innerHeight - r.bottom;
    const mm = (ev) => { off.current = { x: sr - (ev.clientX - sx), y: sb - (ev.clientY - sy) }; clamp(); };
    const mu = () => { window.removeEventListener('mousemove', mm); window.removeEventListener('mouseup', mu); };
    window.addEventListener('mousemove', mm); window.addEventListener('mouseup', mu);
  };
  if (!open) return null;
  return (
    <>
      <style>{TWK_CSS}</style>
      <div ref={ref} className="twk-panel" style={{ right: 16, bottom: 16 }}>
        <div className="twk-hd" onMouseDown={drag}>
          <b>Appearance</b>
          <button className="twk-x" onClick={onClose}>✕</button>
        </div>
        <div className="twk-body">{children}</div>
      </div>
    </>
  );
}

function TweakRadio({ label, value, options, onChange }) {
  const ref = React.useRef(null);
  const opts = options.map(o => typeof o === 'object' ? o : { value: o, label: o });
  const idx = Math.max(0, opts.findIndex(o => o.value === value));
  const n = opts.length;
  const segAt = cx => {
    const r = ref.current.getBoundingClientRect();
    return opts[Math.max(0, Math.min(n - 1, Math.floor(((cx - r.left - 2) / (r.width - 4)) * n)))].value;
  };
  const onPD = e => {
    onChange(segAt(e.clientX));
    const mm = ev => onChange(segAt(ev.clientX));
    const mu = () => { window.removeEventListener('pointermove', mm); window.removeEventListener('pointerup', mu); };
    window.addEventListener('pointermove', mm); window.addEventListener('pointerup', mu);

  return (
    <TweakRow label={label}>
      <div ref={ref} className="twk-seg" onPointerDown={onPD}>
        <div className="twk-seg-thumb" style={{ left: `calc(2px + ${idx}*(100% - 4px)/${n})`, width: `calc((100% - 4px)/${n})` }} />

// ─── Edge geometry ────────────────────────────────────────────────────────────
function edgeGeom(p0, p1) {
  const dx = Math.abs(p1.x - p0.x);
  const off = Math.max(60, dx * 0.48);
  const c0 = { x: p0.x + off, y: p0.y }, c1 = { x: p1.x - off, y: p1.y };
  const d = `M ${p0.x} ${p0.y} C ${c0.x} ${c0.y} ${c1.x} ${c1.y} ${p1.x} ${p1.y}`;
  const mid = {
    x: .125*p0.x + .375*c0.x + .375*c1.x + .125*p1.x,
    y: .125*p0.y + .375*c0.y + .375*c1.y + .125*p1.y,
  };
  return { d, mid };
}

function EdgePath({ p0, p1, color, selected, dim, amount, style, onSelect }) {
  const { d } = edgeGeom(p0, p1);
  const w = Math.max(1.5, Math.min(2.8, 1.3 + Math.sqrt(Math.max(0, amount)) / 36));
  const cls = style === 'solid' ? 'edge-solid' : style === 'dots' ? 'edge-dots' : 'edge-snake';
  return (
    <g className={'edge' + (selected ? ' is-sel' : '') + (dim ? ' is-dim' : '')}
       onMouseDown={e => { e.stopPropagation(); onSelect(); }}>
      <path d={d} stroke="transparent" strokeWidth={20} fill="none" style={{ cursor: 'pointer' }} />
      {selected && <path d={d} stroke={color.ring} strokeWidth={w + 7} fill="none" strokeLinecap="round" opacity=".5" />}
      <path className={cls} d={d} stroke={color.line} strokeWidth={selected ? w + .8 : w} strokeLinecap="round" fill="none" />
    </g>
  );
}

function EdgeLabel({ p0, p1, mode, value, amount, pctEq, color, selected, onChange, onDelete, onSelect }) {
  const { mid } = edgeGeom(p0, p1);
  const [editing, setEditing] = React.useState(false);
  const [draft, setDraft] = React.useState('');
  const inputRef = React.useRef(null);
  React.useEffect(() => { if (editing && inputRef.current) { inputRef.current.focus(); inputRef.current.select(); } }, [editing]);
  const commit = () => { const n = parseFloat(String(draft).replace(/[^0-9.]/g, '')); if (!isNaN(n)) onChange(n); setEditing(false); };
  const primary   = mode === '%' ? fmtPct(value) : fmtMoney(value, { cents: value % 1 !== 0 });
  const secondary = mode === '%' ? fmtMoney(amount) : fmtPct(pctEq);
  return (
    <div className={'edge-pill' + (selected ? ' is-sel' : '')}
         style={{ left: mid.x, top: mid.y, '--pill-ink': color.ink, '--pill-soft': color.soft, '--pill-ring': color.ring }}
         onMouseDown={e => { e.stopPropagation(); onSelect(); }}>
      {editing ? (
        <div className="edge-pill-edit">
          {mode === '$' && <span className="edge-pill-unit">$</span>}
          <input ref={inputRef} value={draft} onChange={e => setDraft(e.target.value)}
            onBlur={commit} onKeyDown={e => { if (e.key === 'Enter') commit(); if (e.key === 'Escape') setEditing(false); }}
            inputMode="decimal" />
          {mode === '%' && <span className="edge-pill-unit">%</span>}
        </div>
      ) : (
        <button className="edge-pill-face"
          onClick={e => { e.stopPropagation(); setDraft(String(value)); setEditing(true); }}>
          <span className="edge-pill-primary">{primary}</span>
          <span className="edge-pill-secondary">{secondary}</span>
        </button>
      )}
      {selected && (
        <button className="edge-pill-del" onMouseDown={e => { e.stopPropagation(); onDelete(); }}>
          <svg viewBox="0 0 24 24" width="11" height="11"><path d="M6 6l12 12M18 6L6 18" stroke="#fff" strokeWidth="2.5" strokeLinecap="round" fill="none"/></svg>
        </button>
      )}
    </div>
  );
}

            onDoubleClick={e => { e.stopPropagation(); setEditName(true); }}>
            {node.name}
          </div>
        )}
        {!isIncome && (
          <button className="node-del" data-nodrag title="Delete bucket"
            onClick={e => { e.stopPropagation(); onDelete(); }}>
            <svg viewBox="0 0 24 24" width="12" height="12" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round">
              <path d="M3 6h18M8 6V4h8v2M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/>
            </svg>
          </button>
        )}
      </div>

      {/* body */}
      <div className="node-body">
        {isIncome ? (
          <label className="amount-row" data-nodrag onMouseDown={e => e.stopPropagation()}>
            <span className="amount-cur">$</span>
            <input className="amount-input" inputMode="decimal" value={node.amount}
              onChange={e => onChangeAmount(e.target.value.replace(/[^0-9.]/g, ''))} />
          </label>
        ) : editAmt ? (
          <div className="amount-row" data-nodrag onMouseDown={e => e.stopPropagation()}>
            <span className="amount-cur">$</span>
            <input ref={amtRef} className="bucket-amount-input" inputMode="decimal"
              value={amtDraft} onChange={e => setAmtDraft(e.target.value.replace(/[^0-9.]/g, ''))}
              onBlur={commitAmt}
              onKeyDown={e => { if (e.key === 'Enter') commitAmt(); if (e.key === 'Escape') setEditAmt(false); }} />
          </div>
        ) : !hasIncome ? (
          <div className="bucket-no-income" data-nodrag>
            <svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" strokeWidth="1.8" strokeLinecap="round">
              <path d="M12 5v14M5 12h14"/>
            </svg>
            Drag an arrow here to receive money
          </div>
        ) : (
          <div className="bucket-amount" onClick={openAmtEdit}
            title="Click to set a target amount">
            {fmtMoney(avail, { cents })}
          </div>
        )}

        <div className="node-meter" title={`${fmtMoney(allocated)} of ${fmtMoney(avail)} flowing out`}>
          <div className={'node-meter-fill' + (over ? ' is-over' : '')}
            style={{ width: (over ? 100 : pct * 100) + '%' }} />
        </div>

        <div className="node-foot">
          <div className="mode-toggle" data-nodrag onMouseDown={e => e.stopPropagation()}>
            <button className={node.mode === '%' ? 'on' : ''} onClick={e => { e.stopPropagation(); onChangeMode('%'); }}>%</button>
            <button className={node.mode === '$' ? 'on' : ''} onClick={e => { e.stopPropagation(); onChangeMode('$'); }}>$</button>
          </div>
          <div className={'leftover ' + leftClass}>
            <span className="leftover-lbl">{leftLabel}</span>
            <span className="leftover-val">{fmtMoney(Math.abs(leftover), { cents })}</span>
          </div>
        </div>
      </div>

      {/* output handle */}
      <div className="handle handle-out" data-nodrag
        onMouseDown={e => { e.stopPropagation(); onStartConnect(node, e); }}>
        <div className="handle-out-tip">Connect</div>
        <div className="handle-out-dot" />
      </div>
    </div>
  );
}

// ─── Canvas ───────────────────────────────────────────────────────────────────
const NODE_W = 244;
const HANDLE_DY = 50; // from top of node to handle center (after drag strip)

function hPos(node, side) {
  return { x: node.x + (side === 'out' ? NODE_W : 0), y: node.y + HANDLE_DY };
}

function Canvas({ nodes, edges, flow, selected, api, t }) {
  const wrapRef = React.useRef(null);
  const [view, setView] = React.useState({ x: 40, y: 20, z: 1 });
  const drag = React.useRef(null);
  const [connect, setConnect] = React.useState(null);
  const [hover, setHover] = React.useState(null);

  const toCanvas = (cx, cy) => {
    const r = wrapRef.current.getBoundingClientRect();
    return { x: (cx - r.left - view.x) / view.z, y: (cy - r.top - view.y) / view.z };
  };

  React.useEffect(() => {
    const move = e => {
      const d = drag.current;
      if (d?.kind === 'pan') {
        setView(v => ({ ...v, x: d.ox + (e.clientX - d.sx), y: d.oy + (e.clientY - d.sy) }));
      } else if (d?.kind === 'node') {
        const p = toCanvas(e.clientX, e.clientY);
        api.moveNode(d.id, Math.round(d.nx + (p.x - d.px)), Math.round(d.ny + (p.y - d.py)));
      } else if (connect) {
        const p = toCanvas(e.clientX, e.clientY);
        setConnect(c => c && { ...c, cur: p });
        const el = document.elementFromPoint(e.clientX, e.clientY);
        const host = el && el.closest('[data-node-id]');
        const tid = host ? host.getAttribute('data-node-id') : null;
        setHover(tid && tid !== connect.fromId ? tid : null);
      }
    };
    const up = e => {
      if (connect) {
        const el = document.elementFromPoint(e.clientX, e.clientY);
        const host = el && el.closest('[data-node-id]');
        const tid = host ? host.getAttribute('data-node-id') : null;
        const p = toCanvas(e.clientX, e.clientY);
        const moved = connect.start ? Math.hypot(p.x - connect.start.x, p.y - connect.start.y) : 99;
        if (tid && tid !== connect.fromId) {
          api.createEdge(connect.fromId, tid);
        } else if (!tid && moved > 12 && !(el && el.closest('.toolbar,.hint-bar,.twk-panel'))) {
          api.createBucketAt(connect.fromId, p.x, p.y);
        }
        setConnect(null); setHover(null);
      }
      drag.current = null;
      document.body.classList.remove('grabbing');
    };
    window.addEventListener('mousemove', move);
    window.addEventListener('mouseup', up);
    return () => { window.removeEventListener('mousemove', move); window.removeEventListener('mouseup', up); };
  }, [connect, view, api]);

  const onBgDown = e => {
    if (e.button !== 0) return;
    api.select(null);
    drag.current = { kind: 'pan', sx: e.clientX, sy: e.clientY, ox: view.x, oy: view.y };
    document.body.classList.add('grabbing');
  };

  const onNodeDown = (node, e) => {
    // allow drag only from the drag strip or non-interactive areas
    if (e.target.closest('[data-nodrag]')) return;
    if (!e.target.closest('[data-drag-handle]') && e.target.closest('.node-head, .node-body, .node-foot, .amount-row')) return;
    const p = toCanvas(e.clientX, e.clientY);
    drag.current = { kind: 'node', id: node.id, nx: node.x, ny: node.y, px: p.x, py: p.y };
  };

  const onWheel = e => {
    e.preventDefault();
    const r = wrapRef.current.getBoundingClientRect();
    const sx = e.clientX - r.left, sy = e.clientY - r.top;
    setView(v => {
      const nz = Math.max(.35, Math.min(2, v.z * (e.deltaY < 0 ? 1.08 : 0.926)));
      const cx = (sx - v.x) / v.z, cy = (sy - v.y) / v.z;
      return { z: nz, x: sx - cx * nz, y: sy - cy * nz };
    });
  };

  React.useEffect(() => {
    api._setView = setView;
    api._spawn = () => {
      const r = wrapRef.current.getBoundingClientRect();
      const c = toCanvas(r.left + r.width * .42, r.top + r.height * .4);
      return { x: Math.round(c.x), y: Math.round(c.y) };
    };
  }, [api, view]);

  const selEdge = selected?.type === 'edge';

  return (
    <div ref={wrapRef}
      className={'canvas grid-' + (t.grid || 'dots') + (connect ? ' is-connecting' : '')}
      onMouseDown={onBgDown} onWheel={onWheel}>
      <div className="board" style={{ transform: `translate(${view.x}px,${view.y}px) scale(${view.z})` }}>
        <div className="grid-bg" />

        {/* SVG edges */}
        <svg className="edge-layer" width="14000" height="14000">
          {edges.map(ed => {
            const a = nodes.find(n => n.id === ed.from), b = nodes.find(n => n.id === ed.to);
            if (!a || !b) return null;
            const color = a.type === 'income' ? colorFor('emerald') : colorFor(a.color);
            const isSel = selected?.type === 'edge' && selected.id === ed.id;
            return (
              <EdgePath key={ed.id} p0={hPos(a,'out')} p1={hPos(b,'in')}
                color={color} selected={isSel}
                dim={selEdge && !isSel}
                amount={flow.edgeAmt[ed.id] || 0} style={t.edge}
                onSelect={() => api.select({ type: 'edge', id: ed.id })} />
            );
          })}
          {connect && (() => {
            const a = nodes.find(n => n.id === connect.fromId);
            const col = a.type === 'income' ? colorFor('emerald') : colorFor(a.color);
            const g = edgeGeom(hPos(a,'out'), connect.cur);
            return <path className="edge-temp" d={g.d} stroke={col.line} strokeWidth="2" fill="none" strokeLinecap="round" />;
          })()}
        </svg>

        {/* Nodes */}
        {nodes.map(node => {
          const color = node.type === 'income' ? colorFor('emerald') : colorFor(node.color);
          const isSel = selected?.type === 'node' && selected.id === node.id;
          return (
            <div key={node.id} onMouseDown={e => onNodeDown(node, e)}>
              <MoneyNode
                node={node} color={color}
                received={flow.received[node.id] || 0}
                allocated={flow.allocated[node.id] || 0}
                leftover={flow.leftover[node.id] || 0}
                selected={isSel}
                connectTarget={hover === node.id}
                isConnecting={!!connect}
                cents={t.cents}
                autoFocusName={isSel && selected?.autoFocusName}
                onSelect={() => api.select({ type: 'node', id: node.id })}
                onRename={v => api.rename(node.id, v)}
                onChangeMode={m => api.changeMode(node.id, m)}
                onChangeAmount={v => api.changeAmount(node.id, v)}
                onSetTargetAmount={target => api.setTargetAmount(node.id, target)}
                onDelete={() => api.deleteNode(node.id)}
                onCycleColor={() => api.cycleColor(node.id)}
                onStartConnect={(n, e) => { const p = toCanvas(e.clientX, e.clientY); setConnect({ fromId: n.id, cur: p, start: p }); }}
                onEndConnect={n => { if (connect && n.id !== connect.fromId) api.createEdge(connect.fromId, n.id); }}
              />
            </div>
          );
        })}

        {/* Edge pills */}
        <div className="pill-layer">
          {edges.map(ed => {
            const a = nodes.find(n => n.id === ed.from), b = nodes.find(n => n.id === ed.to);
            if (!a || !b) return null;
            const color = a.type === 'income' ? colorFor('emerald') : colorFor(a.color);
            const amt = flow.edgeAmt[ed.id] || 0;
            const avail = a.type === 'income' ? (Number(a.amount) || 0) : (flow.received[a.id] || 0);
            const pctEq = avail > 0 ? (amt / avail) * 100 : 0;
            const isSel = selected?.type === 'edge' && selected.id === ed.id;
            return (
              <EdgeLabel key={ed.id} p0={hPos(a,'out')} p1={hPos(b,'in')}
                mode={a.mode} value={ed.value} amount={amt} pctEq={pctEq} color={color}
                selected={isSel}
                onChange={v => api.updateEdgeValue(ed.id, v)}
                onDelete={() => api.deleteEdge(ed.id)}
                onSelect={() => api.select({ type: 'edge', id: ed.id })} />
            );
          })}
        </div>
      </div>
    </div>
  );
}

// ─── App ──────────────────────────────────────────────────────────────────────
const THEMES = { cloud: 'Soft Cloud', mint: 'Mint Ledger', paper: 'Warm Paper', slate: 'Slate Pro' };
const TWK_DEF = { theme: 'cloud', edge: 'snake', grid: 'dots', cents: false };

function Brand() {
  return (
    <div className="brand">
      <div className="brand-mark">
        <svg viewBox="0 0 32 32" width="20" height="20" fill="none">
          <circle cx="7" cy="9" r="3.2" stroke="currentColor" strokeWidth="2.2"/>
          <circle cx="25" cy="7" r="2.5" stroke="currentColor" strokeWidth="2.2"/>
          <circle cx="24" cy="24" r="2.5" stroke="currentColor" strokeWidth="2.2"/>
          <path d="M10 10.5C16 13 14 20 22 23M9.6 11.2C14 12 18 9.5 22.4 7.6"
            stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeDasharray="0.1 4"/>
        </svg>
      </div>
      <span className="brand-text">money<span>flow</span></span>
    </div>
  );
}

function App() {
  const [t, setTweak] = useTweaks(TWK_DEF);
  const [graph, setGraph] = React.useState(() => PRESETS.fifty.build());
  const [selected, setSelected] = React.useState(null);
  const [presetKey, setPresetKey] = React.useState('fifty');
  const [tweaksOpen, setTweaksOpen] = React.useState(false);

  const flow = React.useMemo(() => computeFlow(graph.nodes, graph.edges), [graph]);

  const api = React.useRef({}).current;

  api.select = sel => setSelected(sel);

  api.moveNode = (id, x, y) => setGraph(g => ({
    ...g, nodes: g.nodes.map(n => n.id === id ? { ...n, x, y } : n),
  }));

  api.rename = (id, name) => setGraph(g => ({
    ...g, nodes: g.nodes.map(n => n.id === id ? { ...n, name } : n),
  }));

  api.changeAmount = (id, amount) => setGraph(g => ({
    ...g, nodes: g.nodes.map(n => n.id === id ? { ...n, amount } : n),
  }));

  // set target $ amount on a bucket by adjusting incoming edges
  api.setTargetAmount = (id, target) => setGraph(g => {
    const f = computeFlow(g.nodes, g.edges);
    const inEdges = g.edges.filter(e => e.to === id);
    if (inEdges.length === 0) return g;
    const currentTotal = inEdges.reduce((s, e) => s + (f.edgeAmt[e.id] || 0), 0);
    const newEdges = g.edges.map(e => {
      const ie = inEdges.find(x => x.id === e.id);
      if (!ie) return e;
      const src = g.nodes.find(n => n.id === e.from);
      const srcAvail = src.type === 'income' ? (Number(src.amount) || 0) : (f.received[src.id] || 0);
      const portion = currentTotal > 0 ? (f.edgeAmt[e.id] || 0) / currentTotal : 1 / inEdges.length;
      const targetAmt = target * portion;
      const newValue = src.mode === '%'
        ? (srcAvail > 0 ? Math.round((targetAmt / srcAvail) * 1000) / 10 : 0)
        : Math.round(targetAmt * 100) / 100;
      return { ...e, value: newValue };
    });
    return { ...g, edges: newEdges };
  });

  api.cycleColor = id => setGraph(g => {
    const n = g.nodes.find(x => x.id === id); if (!n) return g;
    const i = PALETTE.findIndex(p => p.key === n.color);
    return { ...g, nodes: g.nodes.map(x => x.id === id ? { ...x, color: PALETTE[(i + 1) % PALETTE.length].key } : x) };
  });

  api.changeMode = (id, mode) => setGraph(g => {
    const node = g.nodes.find(n => n.id === id);
    if (!node || node.mode === mode) return g;
    const f = computeFlow(g.nodes, g.edges);
    const avail = node.type === 'income' ? (Number(node.amount) || 0) : (f.received[id] || 0);
    const edges = g.edges.map(e => {
      if (e.from !== id) return e;
      const amt = f.edgeAmt[e.id] || 0;
      const value = mode === '%'
        ? (avail > 0 ? Math.round((amt / avail) * 1000) / 10 : 0)
        : Math.round(amt);
      return { ...e, value };
    });
    return { ...g, edges, nodes: g.nodes.map(n => n.id === id ? { ...n, mode } : n) };
  });

  api.createEdge = (from, to) => setGraph(g => {
    if (from === to) return g;
    const target = g.nodes.find(n => n.id === to);
    if (!target || target.type === 'income') return g;
    if (g.edges.some(e => e.from === from && e.to === to)) return g;
    const src = g.nodes.find(n => n.id === from);
    const f = computeFlow(g.nodes, g.edges);
    const avail = src.type === 'income' ? (Number(src.amount) || 0) : (f.received[from] || 0);
    const remaining = Math.max(0, avail - (f.allocated[from] || 0));
    const value = src.mode === '%'
      ? (avail > 0 ? Math.max(0, Math.round((remaining / avail) * 100)) : 0)
      : Math.round(remaining);
    const e = { id: uid('e'), from, to, value };
    setSelected({ type: 'edge', id: e.id });
    return { ...g, edges: [...g.edges, e] };
  });

  api.updateEdgeValue = (id, value) => setGraph(g => ({
    ...g, edges: g.edges.map(e => e.id === id ? { ...e, value } : e),
  }));

  api.deleteEdge = id => { setGraph(g => ({ ...g, edges: g.edges.filter(e => e.id !== id) })); setSelected(null); };

  api.deleteNode = id => setGraph(g => {
    const n = g.nodes.find(x => x.id === id);
    if (!n || n.type === 'income') return g;
    setSelected(null);
    return { nodes: g.nodes.filter(x => x.id !== id), edges: g.edges.filter(e => e.from !== id && e.to !== id) };
  });

  // smart placement: spread new nodes without stacking
  api.addNode = () => setGraph(g => {
    const sp = api._spawn ? api._spawn() : { x: 500, y: 300 };
    let x = sp.x - NODE_W / 2, y = sp.y - 70;
    // nudge until no overlap
    for (let attempt = 0; attempt < 12; attempt++) {
      const overlap = g.nodes.some(n => Math.abs(n.x - x) < NODE_W + 20 && Math.abs(n.y - y) < 180);
      if (!overlap) break;
      y += 200;
    }
    const usedColors = g.nodes.filter(n => n.type === 'bucket').length;
    const color = PALETTE[usedColors % PALETTE.length].key;
    const node = { id: uid('n'), type: 'bucket', name: 'New Bucket', icon: 'coins', color, mode: '%', x, y };
    setSelected({ type: 'node', id: node.id, autoFocusName: true });
    return { ...g, nodes: [...g.nodes, node] };
  });

  api.createBucketAt = (from, x, y) => setGraph(g => {
    const src = g.nodes.find(n => n.id === from); if (!src) return g;
    const usedColors = g.nodes.filter(n => n.type === 'bucket').length;
    const color = PALETTE[usedColors % PALETTE.length].key;
    const nx = Math.round(x), ny = Math.round(y - HANDLE_DY);
    const node = { id: uid('n'), type: 'bucket', name: 'New Bucket', icon: 'coins', color, mode: '%', x: nx, y: ny };
    const f = computeFlow(g.nodes, g.edges);
    const avail = src.type === 'income' ? (Number(src.amount) || 0) : (f.received[from] || 0);
    const remaining = Math.max(0, avail - (f.allocated[from] || 0));
    const value = src.mode === '%'
      ? (avail > 0 ? Math.max(0, Math.round((remaining / avail) * 100)) : 0)
      : Math.round(remaining);
    const e = { id: uid('e'), from, to: node.id, value };
    setSelected({ type: 'node', id: node.id, autoFocusName: true });
    return { nodes: [...g.nodes, node], edges: [...g.edges, e] };
  });

  api.loadPreset = key => {
    setPresetKey(key); setGraph(PRESETS[key].build()); setSelected(null);
    if (api._setView) api._setView({ x: 40, y: 20, z: 1 });
  };
  api.recenter = () => { if (api._setView) api._setView({ x: 40, y: 20, z: 1 }); };

  // keyboard: delete / escape
  React.useEffect(() => {
    const onKey = e => {
      const typing = /^(INPUT|TEXTAREA)$/.test(document.activeElement?.tagName);
      if (e.key === 'Escape') { setSelected(null); document.activeElement?.blur(); return; }
      if ((e.key === 'Delete' || e.key === 'Backspace') && !typing) {
        if (!selected) return;
        e.preventDefault();
        if (selected.type === 'edge') api.deleteEdge(selected.id);
        else api.deleteNode(selected.id);
      }
    };
    window.addEventListener('keydown', onKey);
    return () => window.removeEventListener('keydown', onKey);
  }, [selected]);

  const summary = React.useMemo(() => {
    let income = 0, assigned = 0;
    graph.nodes.forEach(n => {
      if (n.type === 'income') { income += Number(n.amount) || 0; assigned += flow.allocated[n.id] || 0; }
    });
    return { income, assigned, free: income - assigned };
  }, [graph, flow]);

  const freeState = Math.abs(summary.free) < .5 ? 'ok' : summary.free < 0 ? 'over' : 'warn';

  return (
    <div className="app" data-theme={t.theme}>
      <header className="toolbar">
        <Brand />
        <div className="tb-sep" />
        <div className="tb-row">
          <label className="preset-wrap">
            <svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round">
              <path d="M4 6h16M4 12h10M4 18h7"/>
            </svg>
            <select value={presetKey} onChange={e => api.loadPreset(e.target.value)}>
              {Object.keys(PRESETS).map(k => <option key={k} value={k}>{PRESETS[k].label}</option>)}
            </select>
          </label>
          <button className="tb-btn primary" onClick={() => api.addNode()}>
            <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" strokeWidth="2.4" strokeLinecap="round"><path d="M12 5v14M5 12h14"/></svg>
            Add bucket
          </button>
          <button className="tb-btn ghost" onClick={() => api.recenter()} title="Recenter (fit all nodes)">
            <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round">
              <path d="M12 3v3M12 18v3M3 12h3M18 12h3"/><circle cx="12" cy="12" r="4"/>
            </svg>
          </button>
          <button className="tb-btn ghost" onClick={() => setTweaksOpen(v => !v)} title="Appearance">
            <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round">
              <circle cx="12" cy="12" r="3"/>
              <path d="M19.07 4.93A10 10 0 0 0 4.93 19.07M4.93 4.93a10 10 0 0 0 0 14.14"/>
            </svg>
          </button>
        </div>
        <div className="tb-space" />
        <div className="summary">
          <div className="sum-item">
            <span className="sum-lbl">Take-home</span>
            <span className="sum-val">{fmtMoney(summary.income)}</span>
          </div>
          <div className="sum-sep" />
          <div className="sum-item">
            <span className="sum-lbl">Assigned</span>
            <span className="sum-val">{fmtMoney(summary.assigned)}</span>
          </div>
          <div className="sum-sep" />
          <div className={'sum-item unassigned ' + freeState}>
            <span className="sum-lbl">{summary.free < -.5 ? 'Over budget' : 'Unassigned'}</span>
            <span className="sum-val">{fmtMoney(Math.abs(summary.free))}</span>
          </div>
        </div>
      </header>

      <Canvas nodes={graph.nodes} edges={graph.edges} flow={flow} selected={selected} api={api} t={t} />

      <div className="hint-bar">
        <span><b>Drag grip</b> at top of card to move · <b>right dot</b> to connect</span>
        <span><b>Click</b> a bucket's amount or line pill to edit</span>
        <span><b>Delete / ⌫</b> removes selection · scroll to zoom</span>
      </div>

      <TweaksPanel open={tweaksOpen} onClose={() => setTweaksOpen(false)}>
        <TweakSection label="Theme" />
        <TweakSelect label="Color scheme" value={t.theme}
          options={Object.keys(THEMES).map(k => ({ value: k, label: THEMES[k] }))}
          onChange={v => setTweak('theme', v)} />
        <TweakSection label="Canvas" />
        <TweakRadio label="Flow lines" value={t.edge} options={['snake','dots','solid']} onChange={v => setTweak('edge', v)} />
        <TweakRadio label="Grid" value={t.grid} options={['dots','lines','none']} onChange={v => setTweak('grid', v)} />
        <TweakToggle label="Show cents" value={t.cents} onChange={v => setTweak('cents', v)} />
      </TweaksPanel>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
